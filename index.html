 the Mac.</li>\n<li>If macOS refuses to open it the first time, right-click the app icon and choose &quot;Open&quot; instead of double-clicking.</li>\n<li>When prompted, allow access to the Microphone, Local Network, and Documents Folder. The Local Network prompt may show an odd internal name — that's normal; click Allow.</li>\n<li>If you're asked for Local Network access every single time you open the app (not just the first time), tell your supervisor and note the Mac's name.</li>\n<li>If you change any permission in System Settings, fully quit and reopen Hydra afterward for it to take effect.</li>\n</ul>\n\n<h3>Before every session — physical checklist</h3>\n<ul>\n<li>Use only the camera-radar kit you were assigned. Don't mix parts from different kits.</li>\n<li>Plug the radar and microphone into the Mac using short USB cables. If you use a USB hub during recording, it must run on the Mac's own battery power — never keep a hub plugged into a wall outlet during a session.</li>\n<li>Turn on the camera. Check it has enough battery and storage.</li>\n<li>Set the camera to full 360&deg; video mode (not the single-lens mode).</li>\n<li>On the camera, go to Settings &rarr; General &rarr; Auto Power Off and set it to Never.</li>\n<li>Connect the Mac to the camera's own Wi-Fi network — confirm you're joined to the camera's network, not the office Wi-Fi.</li>\n<li>Turn off Auto-Join for the office Wi-Fi so the Mac doesn't wander off the camera's network mid-session.</li>\n<li>Make sure both the Mac and the camera are charged, and disable sleep on the Mac.</li>\n<li>If the location allows it, use the Mac's built-in speakers (not Bluetooth headphones) at a moderate volume — a short chirp sound plays at the start of recording to help line up the audio and video.</li>\n</ul>\n\n<h2>3. The Golden Rule: &quot;Devices 3/3&quot;</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>Never start recording unless Hydra's footer shows Devices 3/3.</strong> Open the Devices panel and check all three rows say &quot;paired&quot;: the radar, the camera, and the microphone. Simply being connected to the camera's Wi-Fi is not enough — Hydra needs to actively confirm it can start and stop the camera. If a row says &quot;Wi-Fi connected &middot; control service not ready,&quot; power-cycle the camera, rejoin its Wi-Fi, and wait for the third checkmark. Also confirm the Mac's storage indicator is green with enough free space.</div></div>\n<p>Do not click Start Capture with anything less than a full 3/3 — a missing or unpaired device means the recording will be unusable.</p>\n\n<h2>4. Running a Session, Start to Finish</h2>\n<ol>\n<li><strong>Create the session in Hydra</strong> — enter your assignment ID, select the room(s) you'll actually record, and confirm consent for everyone who'll appear on camera.</li>\n<li><strong>Record C0 once</strong> — you move the rig yourself for about a minute. Review it, then Accept.</li>\n<li><strong>Confirm the current room</strong> — before you press Start Capture, plan out several good spots in the room.</li>\n<li><strong>Check Devices 3/3</strong> — every time, without exception.</li>\n<li><strong>Record one T1 room capture</strong> — 10 to 15 short natural-movement clips, moving the rig between each one.</li>\n<li><strong>Review and Accept</strong> — check the clips, accept the room, and move to the next selected room (repeat steps 3&ndash;6).</li>\n<li><strong>Ingest</strong> — after every selected room is done, upload and package the video.</li>\n</ol>\n\n<h3>Step 1 — Create the session</h3>\n<ul>\n<li>Enter the assignment ID you were given (called the <strong>Feather Task ID</strong> in Hydra).</li>\n<li>Select whether one or two people are available. This is just planning information — it doesn't lock you into a fixed number of actions or activities.</li>\n<li>Under &quot;Rooms available for this session,&quot; select every room you will actually record right now. Hydra automatically lines up one C0 step and one T1 capture for each room you pick.</li>\n<li>Select the age range and confirm consent. Every single person who will appear on camera must be consented — no exceptions.</li>\n<li>Click Create Session.</li>\n</ul>\n\n<h3>Step 2 — Record C0 (the calibration motion)</h3>\n<ul>\n<li>Set the rig down at a safe, neutral spot with the cables slack and the mounting undisturbed.</li>\n<li>Confirm Devices 3/3, click Start Capture, and wait for the short chirp sound to finish playing.</li>\n<li>Click Start Episode once the rig is holding still.</li>\n<li>Pick the rig up with both hands. Make one or more smooth, loop-like or figure-eight-like motions — gentle tilting and rotating are good.</li>\n<li>Add some movement in different directions — forward/back, side to side, up/down — roughly 20&ndash;40 cm when you have the space. Smooth and varied is what matters, not an exact shape.</li>\n<li>Set it down securely and click End Episode at around 55 seconds.</li>\n<li>Click Finish Scenario, watch the playback, and choose Accept or Redo Scenario.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>When to Accept vs. Redo C0.</strong> Accept when all three sensors recorded, the mount stayed rigid, and the motion was smooth and varied. Redo only when a sensor failed, the mount came loose, you dropped or shook the rig, or there was almost no real movement. A slightly different loop shape, a bit more or less tilt, or small timing differences are <strong>not</strong> reasons to redo.</div></div>\n\n<h3>Step 3 — Plan the room before you start recording</h3>\n<ul>\n<li>Confirm which room you're in — Hydra will suggest the next unfinished room from your original selection, or you can pick a different unfinished one.</li>\n<li>Carry the full Mac + rig + cable bundle into the room only while every sensor is stopped. Never change rooms mid-recording.</li>\n<li>Leave the room's furniture as it normally is — don't stage it.</li>\n<li>Walk the room and pick out 6&ndash;8 good spots to set the rig down — different distances, angles, and sides of the room. Plan an efficient order to move between them.</li>\n<li>Make sure the radar's flat face (the front) points toward the open area where people will move — not toward the side with the cables.</li>\n<li>Make sure everyone who will be on camera, and the path they'll walk, stays visible to the camera at all times. Don't plan for anyone to be deliberately hidden or blocked.</li>\n<li>Get the rig ready to be fully mobile: Mac on battery power, radar and microphone on their short cables, camera on its own battery and Wi-Fi. Before you click Start Capture, unplug the Mac from the wall and disconnect any wall-powered hub — nothing should be tethered to anything fixed.</li>\n</ul>\n\n<h3>Step 4 — Record T1 (natural movement, one room)</h3>\n<ul>\n<li>Set the rig down at your first planned spot.</li>\n<li>Confirm Devices 3/3.</li>\n<li>Click Start Capture and wait — Start Episode stays greyed out until the chirp sound finishes and the rig is holding still.</li>\n<li>Click Start Episode.</li>\n<li>Ask people to move naturally — walking, sitting, standing, waving, bending, whatever feels normal for the space. They can move at any natural pace. With more than one person, have them move independently rather than as a coordinated group.</li>\n<li>Keep an eye on the on-screen tracking indicator. If it asks for attention, have someone make one clear, natural movement, or move a little closer to the radar. This indicator is a helpful nudge — it doesn't invalidate the clip.</li>\n<li>Click End Episode at around 55 seconds — this is guidance, not an exact cutoff.</li>\n<li>Immediately and smoothly pick up the rig, carry it to the next planned spot, and set it down securely. Don't stand around deciding — plan ahead so this transition is quick.</li>\n<li>As soon as the rig is stable, hands are off, and cables are slack, click Start Episode again — there's no fixed waiting period.</li>\n<li>Repeat until you have 10&ndash;15 good clips, then click Finish Scenario.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Good to know.</strong> The sensors never stop recording between clips — Start/End Episode just marks timestamps. Don't power anything off between clips. The pickup-carry-setdown moments are useful data too, but they are not a substitute for the separate C0 calibration step. 15 clips is a ceiling, not a target — stop earlier if you've genuinely covered the room well. Movement guidance: inside the radar's forward-facing view (the FOV), people can move freely near or far, up to about 5&nbsp;meters. If someone steps outside that view, keep them within about 2&nbsp;m and bring them back before 3&nbsp;m.</div></div>\n\n<h3>Step 5 — Review the room capture</h3>\n<ul>\n<li>Open &quot;Review completed episodes&quot; in Hydra.</li>\n<li>For each clip, decide whether to keep it checked (&quot;Retain&quot;) or uncheck it. Unchecking keeps the raw recording but excludes that one clip from the count — you can still redo that same view later.</li>\n<li>Use the preview to spot-check video and audio if it's available.</li>\n<li>Choose Accept to keep the room and move on, or Redo Scenario to throw out the whole room and start it over.</li>\n</ul>\n<p>Accept is your call as the moderator team, even if the clip count or timing isn't a perfect match for the guidance above. After you Accept a room, all sensors stop. Carry the rig to the next room you selected at Intake and repeat Steps 3&ndash;5. Don't stop early just because one room went well — every selected room needs to be completed before you move to upload.</p>\n\n<h3>Step 6 — Upload the recording (Ingestion)</h3>\n<ul>\n<li>Stay connected to the camera's Wi-Fi network.</li>\n<li>Open the Ingestion screen in Hydra. Seeing &quot;Devices 1/1&quot; here is correct and expected — only the camera needs to transfer video; the radar and microphone data are already saved locally.</li>\n<li>Click Begin Ingestion.</li>\n<li>Keep Hydra open and stay on the camera's Wi-Fi until the transfer reaches 100% <em>and</em> both validation and packaging finish.</li>\n<li>If the Wi-Fi drops partway through, reconnect to the camera and click Retry Ingestion — Hydra remembers what already transferred successfully and only retries what's missing.</li>\n</ul>\n<p>Only once ingestion fully finishes should you disconnect from the camera's Wi-Fi and reconnect the Mac to the internet to upload the final package.</p>\n\n<h2>5. Troubleshooting</h2>\n<p>Most problems are solved by one of these fixes. Work down the table before asking for help.</p>\n<table class=\"tbl\">\n<tr><th>If you see&#8230;</th><th>Do this</th></tr>\n<tr><td>Camera won't pair while on office Wi-Fi</td><td>Switch the Mac to the camera's own Wi-Fi network, wait a moment, and refresh the device status.</td></tr>\n<tr><td>&quot;Wi-Fi connected &middot; control service not ready&quot;</td><td>Power-cycle the camera, rejoin its Wi-Fi, and wait for the full 3/3.</td></tr>\n<tr><td>Camera still won't pair on the right Wi-Fi</td><td>Check the Local Network permission was allowed, power-cycle the camera, then restart Hydra.</td></tr>\n<tr><td>Devices show 2/3</td><td>Open Devices and follow the on-screen message for the specific device. Don't start recording until it reads 3/3.</td></tr>\n<tr><td>Radar not paired</td><td>Unplug and replug its USB cable, wait, then restart the Hydra backend. Don't run any other radar software at the same time.</td></tr>\n<tr><td>Microphone missing</td><td>Reseat its cable (directly or through the approved hub), then restart the Hydra backend.</td></tr>\n<tr><td>Microphone sounds static or crackly</td><td>Treat it as a hardware problem — swap it out or isolate the connection before continuing.</td></tr>\n<tr><td>Start Capture button is greyed out</td><td>Wait for Devices 3/3, a stable connection, green storage, and make sure no review screen is still open.</td></tr>\n<tr><td>Mac storage warning</td><td>Free up at least the amount of space shown on screen, then try again.</td></tr>\n<tr><td>Camera storage warning after clicking Start Capture</td><td>Free up the amount of space shown on that camera and click Start Capture again — nothing was recorded yet.</td></tr>\n<tr><td>Only one room is available today</td><td>That's fine — complete the session in that one room. Just make sure future sessions use different rooms.</td></tr>\n<tr><td>The room you planned to move to is unavailable</td><td>Before starting, pick a different unfinished room from your original selection instead.</td></tr>\n<tr><td>Start Episode stays greyed out</td><td>Wait for the chirp sound to finish playing before it becomes clickable.</td></tr>\n<tr><td>You recorded the wrong view or made a mistake in a clip</td><td>End the episode, uncheck &quot;Retain&quot; for that clip, move to the correct spot, and record it again.</td></tr>\n<tr><td>Camera preview looks black on screen</td><td>That's just a preview issue — check the real video after ingestion finishes, and don't accept the room if that footage is genuinely missing.</td></tr>\n<tr><td>Camera's Wi-Fi drops mid-recording</td><td>Reconnect the Mac to the same camera. If it's still recording, press its physical shutter button once to stop it; if it's already idle, don't press anything. Wait for Devices 3/3 before continuing.</td></tr>\n<tr><td>Upload (ingestion) gets interrupted</td><td>Reconnect to the camera's Wi-Fi and click Retry Ingestion. Don't try to upload anywhere until validation passes.</td></tr>\n<tr><td>Radar or another required sensor fails mid-recording</td><td>Hydra stops everything automatically and opens the review screen. Accept the clips that finished normally, or redo the whole room.</td></tr>\n</table>\n\n<h2>6. Glossary</h2>\n<table class=\"tbl\">\n<tr><th>Term</th><th>What it means</th></tr>\n<tr><td>Hydra</td><td>The macOS app that controls the camera, radar, and microphone and manages the actual recording of a session. Separate from the Sesame App.</td></tr>\n<tr><td>Sesame App</td><td>A webapp accessible from any Centific project device. A full session checklist plus the session log/incident tracker. Never touches capture data.</td></tr>\n<tr><td>Rig</td><td>The single mounted bundle of camera + radar + microphone. Always moves and mounts as one unit.</td></tr>\n<tr><td>C0</td><td>The one-time, moderator-only calibration motion recorded at the start of each session.</td></tr>\n<tr><td>T1</td><td>The natural-movement recording, done once per room, made up of 10&ndash;15 short clips.</td></tr>\n<tr><td>Episode / clip</td><td>One short (~55 second) recorded segment within a room capture.</td></tr>\n<tr><td>Devices 3/3</td><td>The all-clear signal meaning the camera, radar, and microphone are all connected and ready in Hydra.</td></tr>\n<tr><td>Intake</td><td>Hydra's setup screen where you enter your assignment (Feather Task) ID and pick which room(s) you'll record.</td></tr>\n<tr><td>Ingestion</td><td>The process of uploading and packaging the camera's video after all rooms are recorded.</td></tr>\n<tr><td>FOV (field of view)</td><td>The area in front of the radar that it can &quot;see&quot; clearly — roughly a 120&deg; wedge, out to about 5 meters.</td></tr>\n<tr><td>Chirp</td><td>A short sound played at the very start of a recording that helps line up video and audio afterward.</td></tr>\n<tr><td>Accept / Redo Scenario</td><td>Your review decision in Hydra: keep this recording (Accept) or throw it out and record it again (Redo).</td></tr>\n<tr><td>Retain (an attempt)</td><td>Marking a specific clip as good enough to keep for later review; unchecking it excludes that clip without deleting the raw recording.</td></tr>\n</table>\n\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>Quick reference.</strong> Devices 3/3 before every recording, no exceptions &middot; C0 once per session, you move the rig, no one else &middot; T1 once per room, 10&ndash;15 natural clips, moving between planned spots &middot; never stop the sensors between clips within a room &middot; finish every selected room before you start Ingestion &middot; when in doubt about a clip, it's your judgment call to Accept or Redo.</div></div>\n"}, {"id": "hardware", "ic": "&#128268;", "title": "Hardware Setup", "sub": "Equipment and hardware setup for Sesame sessions.", "min": 6, "gate": "stub", "body": "\n<p>This module is covered hands-on at in-person training, led by Riley Robertson. You'll get the full walkthrough with the actual equipment — the substance doesn't translate well to a screen. Here's the technology list you'll be trained on, and the one rule that's already settled.</p>\n<div class=\"awaiting\"><div class=\"a-ic\">&#9203;</div><div class=\"a-tx\"><strong>Full hands-on content pending.</strong> Check the box below once you've read this placeholder — the real content will replace it before your on-site training date, and your progress won't reset when it does.</div></div>\n<h2>Project Sesame technologies and hardware</h2>\n<p>You will be trained on all five of the following:</p>\n<ul>\n<li><strong>Hydra</strong> (macOS app) — controls the camera, radar, and microphone and manages the actual recording of a session.</li>\n<li><strong>Insta360 X5 camera</strong> — Wi-Fi control, 360&deg; video mode.</li>\n<li><strong>TI IWRL6432AOP mmWave radar</strong> — connected by USB.</li>\n<li><strong>miniDSP ambiMIK microphone</strong> — connected by USB.</li>\n<li><strong>macOS laptop</strong> — Finder, System Settings (permissions, storage).</li>\n</ul>\n<p>The Sesame App (the session checklist webapp) is separate from this hardware list and is covered in its own module.</p>\n<h2>Already settled</h2>\n<ul>\n<li>Equipment: Hydra, the 360&deg; camera, the radar unit, and the microphone, all mounted on one rigid rig.</li>\n<li><strong>You do not start a capture with fewer than all three sensors confirmed connected — Devices 3/3.</strong> This is non-negotiable and the single most common early mistake. Full detail is in the Project Guidelines module.</li>\n</ul>\n"}, {"id": "tools", "ic": "&#128241;", "title": "The Sesame App", "sub": "The session checklist webapp — separate from Hydra, and where the session log lives.", "min": 6, "gate": "stub", "body": "\n<p>This module is covered hands-on at in-person training, led by Riley Robertson. You'll get the full walkthrough — the substance doesn't translate well to a screen. Here's what the Sesame App is, and how it's different from Hydra.</p>\n<div class=\"awaiting\"><div class=\"a-ic\">&#9203;</div><div class=\"a-tx\"><strong>Full hands-on content pending from Riley Robertson.</strong> Check the box below once you've read this placeholder — the real content will replace it before your on-site training date, and your progress won't reset when it does.</div></div>\n<h2>What the Sesame App is</h2>\n<p>The Sesame App is a <strong>webapp</strong> you can access from any Centific project device — not just the MacBook running Hydra. It's a full session checklist that walks you through every required step of a Sesame session, with fields for entering session metadata as you go.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#128203;</div><div class=\"c-tx\"><strong>The session log and incident tracker live in the Sesame App.</strong> Whatever you'd otherwise write down about how a session went — outcome, issues, escalations — has a field for it here.</div></div>\n<h2>Already settled</h2>\n<ul>\n<li><strong>The Sesame App does not touch multimodal capture data.</strong> It never records video, audio, or radar data — that's Hydra's job, exclusively. The Sesame App only handles the checklist, metadata, and session log.</li>\n<li>Login and profile setup are covered hands-on; there is nothing to pre-configure before your training day.</li>\n<li>The full step-by-step recording procedure (what Hydra does) is in the Project Guidelines module — read it before training so the hands-on day builds on something.</li>\n</ul>\n"}, {"id": "troubleshooting", "ic": "&#128295;", "title": "Troubleshooting", "sub": "What to do when Hydra or the equipment misbehaves.", "min": 6, "gate": "stub", "body": "\n<p>This module is covered hands-on at in-person training, led by Riley Robertson. You'll get the full walkthrough with the actual equipment and materials — the substance doesn't translate well to a screen. Here's what to expect, and the one or two things already settled.</p>\n<div class=\"awaiting\"><div class=\"a-ic\">&#9203;</div><div class=\"a-tx\"><strong>Full content pending from Riley Robertson.</strong> Check the box below once you've read this placeholder — the real content will replace it before your on-site training date, and your progress won't reset when it does.</div></div>\n<h2>Already settled</h2>\n<ul>\n<li><strong>Never force-quit Hydra</strong> during a capture, or while it's finalizing or packaging a session — this is one of the most common ways to lose a completed session's data.</li>\n<li>You are not expected to repair hardware. Work the troubleshooting table in the Project Guidelines module first, and if it's not resolved, escalate — that's not a failure.</li>\n</ul>\n"}, {"id": "comms", "ic": "&#128172;", "title": "Participant Communication", "sub": "Greeting, orienting, and closing a session at the Las Vegas Lab.", "min": 10, "gate": "quiz", "body": "\n<h2>The contact cadence</h2>\n<p>Sessions are booked in advance and participants arrive at the Centific Las Vegas Lab for their appointment. There's no travel or en-route call on this collection — the cadence starts when they walk in.</p>\n\n<h2>Greeting and orientation</h2>\n<p>Open with a friendly, professional greeting.</p>\n<div class=\"script\">&quot;Thank you for participating in Project Sesame. We appreciate your time today.&quot;</div>\n<p>Then orient them to what's about to happen, before anything starts. This is the single biggest lever on data quality — a clear, plain briefing produces natural movement; a vague one produces stiff, self-conscious movement.</p>\n<div class=\"script\">&quot;We'll be moving through a few different rooms today. In each one, I'll ask you to move around naturally — walk over to things, interact with the room a bit, just like you would at home. There's no script and no wrong way to do it. I'll show you what I mean before we start each room, and you can ask me anything or take a break at any point.&quot;</div>\n<p>Cover before anything is switched on:</p>\n<ul>\n<li>Roughly how long the session will take.</li>\n<li>That you'll brief each room before it starts, and demonstrate if helpful.</li>\n<li>That you may ask for a room to be redone — completely normal, never a comment on them.</li>\n<li>That they may be seen and heard on camera, and what that means (it's for validating the primary sensor data, not the focus of the collection).</li>\n<li>That they can stop, pause, or ask anything at any point.</li>\n</ul>\n\n<h2>Confirming consent</h2>\n<p>Confirm the ICF and NDA were completed on OneForma before any capture begins. If they haven't been, sort that first — see Module 3, Script C2.</p>\n\n<h2>No playback</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Never a flat refusal, never a screening.</strong> Confirmed policy, consistent with prior Centific collections: &quot;we got the capture we need, let's move to the next one&quot; — not &quot;no, you can't&quot; and not showing them the monitor. See Module 3, Script C15 for the full exchange.</div></div>\n\n<h2>During the session</h2>\n<table class=\"tbl\">\n<tr><th>Do</th><th>Don't</th></tr>\n<tr><td>Be professional and courteous throughout</td><td>Discuss project or client details you weren't briefed on</td></tr>\n<tr><td>Brief each room clearly before recording</td><td>Keep running commentary going during an episode</td></tr>\n<tr><td>Ask permission before repositioning anything in a room</td><td>Rush a participant who needs a moment</td></tr>\n<tr><td>Thank participants for their time and effort</td><td>Leave equipment or materials in the room when you're done</td></tr>\n</table>\n\n<h2>Before the participant leaves</h2>\n<p>By the time the session ends, every participant should know:</p>\n<ul>\n<li>That their session was completed and submitted successfully.</li>\n<li>That Oslo_comms@centific.com handles anything further — payment, consent, follow-up questions (though pay details are already on their OneForma profile).</li>\n<li>That they will not receive or review copies of the footage.</li>\n</ul>\n<p>Thank them explicitly at the close.</p>\n\n<h2>Session debrief: what you may tell them afterward</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>There is no session debrief on Sesame.</strong> You do not tell a participant whether their session passed, what happens to the footage next, or whether they'll be contacted again — you won't know, and it isn't yours to say. &quot;That gets reviewed by a different team, so I won't see the outcome&quot; is a complete, honest answer.</div></div>\n\n<h2>Two PII rules, and they are absolute</h2>\n<ul>\n<li><strong>Never spoken while a capture is rolling.</strong> If you need to refer to the participant mid-capture, say &quot;the participant,&quot; not their name.</li>\n<li><strong>Never written anywhere the booking doesn't already hold it.</strong> Not in free-text app fields, not in a message, not in an escalation note. Use the session reference instead.</li>\n</ul>\n"}, {"id": "hourspay", "ic": "&#128176;", "title": "Your Hours and Pay", "sub": "What you're paid for, your timesheet, and how you're paid.", "min": 7, "gate": "quiz", "body": "\n<h2>What you are paid for</h2>\n<p>Your agency pays you for <strong>all hours worked during collection sessions</strong>, and for <strong>any training hours confirmed by the Sesame PM team</strong>. Log both in your timesheet system against the Project ID your Project Manager gives you.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#128176;</div><div class=\"c-tx\"><strong>Your training-hour rate and your work-hour rate are both communicated to you at the time you're hired, by your C2C agency.</strong> Neither is set or announced by Centific — if the number you were given at hiring doesn't match what you see on a paycheck, that's a conversation with your agency, not your Project Manager.</div></div>\n\n<h2>Mileage</h2>\n<p><strong>Not currently applicable.</strong> Sesame runs entirely at the Centific Las Vegas Lab — there's no participant-home driving to reimburse. If the project expands to offsite collection, this section will be updated with a mileage policy at that time.</p>\n\n<h2>Your timesheet</h2>\n<p>Go to <strong>timesheet.centific.com</strong> and choose &quot;Login by SSO.&quot; Use your Centific v_dash email credential and password. Your moderator email address was provided by Centific IT in your welcome letter.</p>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — Samay Timesheet Walkthrough<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Oslo_Sesame_Moderators2/Shared%20Documents/Centific%20Video%20Resources/Moderator%20Fundamentals%20-%20Samay%20Timesheet%20Walkthrough.mp4?d=w40d99d40404548d49a0ef03aa86e710a&csf=1&web=1&e=JwgnwL\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n<p><strong>Your logged hours become your paycheck.</strong> The approved-hours figure your Project Manager submits is built from what you logged. Late or missing entries delay your own payment.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Participant pay is different from yours.</strong> Participants are paid through Tremendous, per the terms on their OneForma profile — that's their pay flow, not yours. Your pay runs through your agency and your timesheet, described below.</div></div>\n\n<h2>You work with Centific. Your agency employs you.</h2>\n<p>Two different relationships, and keeping them clear protects you. Centific directs the work: what the sessions need, how the data is captured, what good quality looks like. Your agency is your employer — they hold your contract, they pay you, set your rate at hiring, and handle your terms. Your Centific email starts with v_ for exactly this reason: it marks you as working through a vendor rather than as staff.</p>\n<p><strong>How to describe the work:</strong> you are a moderator working with Centific, not for Centific. To participants, you moderate on behalf of Centific. On LinkedIn or a CV, list your agency as your employer and describe the work as data collection moderating carried out on behalf of Centific. Do not list Centific as your employer or give yourself a Centific job title.</p>\n<table class=\"tbl\">\n<tr><th>If it is about...</th><th>Ask</th></tr>\n<tr><td>Doing the work — guidelines, tools, scheduling, quality, support mid-session</td><td>Centific (your PM)</td></tr>\n<tr><td>Your employment — pay, rate, contract, hours, time off, benefits, taxes, future work</td><td>Your C2C agency</td></tr>\n</table>\n<p>Centific staff cannot change your rate, approve a bonus, negotiate more hours, or promise future work. If you raise these they will point you back to your agency. That is not a brush-off — they have no authority to act, and your agency does; your rate was set with them at hiring.</p>\n\n<h2>How you are paid</h2>\n<p>As a C2C moderator your contract is with your agency. You log hours, you reconcile them with your Project Manager, the PM approves them at the close of each pay period, and Centific reports them onward to your agency. Your agency issues payment.</p>\n<table class=\"tbl\">\n<tr><th>Question</th><th>Ask</th></tr>\n<tr><td>&quot;My hours don't look right&quot;</td><td>Your Project Manager</td></tr>\n<tr><td>&quot;When will I be paid?&quot;</td><td>Your agency</td></tr>\n<tr><td>&quot;What is my rate?&quot;</td><td>Your agency — set at the time you were hired</td></tr>\n<tr><td>&quot;Can I get a raise, a bonus, or more hours?&quot;</td><td>Your agency</td></tr>\n</table>\n"}];

function loadCurriculumOverrides(){
  try{
    const raw = localStorage.getItem('sesame_curriculum_v1');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.modQuestions) MOD_QUESTIONS = saved.modQuestions;
    if(saved.finalCheck)   FINAL_CHECK   = saved.finalCheck;
  }catch(e){}
}

}

  try{ localStorage.removeItem('sesame_curriculum_v1'); }catch(e){}

function persistLocal(){

function restoreLocalSession(email){
  try{
    const raw = localStorage.getItem(sessionKeyFor(email));
    if(!raw) return;
    const d = JSON.parse(raw);
    // Admin accounts use the dashboard, not the learning path.
    // Don't restore quizAnswers for admins so the Curriculum tab is always fresh.
    const rec = findUser(email);
    if(rec && rec.role === 'admin'){
      stubChecked = d.stubChecked || {};
      checklistOpen = d.checklistOpen || {};
    } else {
      quizAnswers = d.quizAnswers || {};
      stubChecked = d.stubChecked || {};
      checklistOpen = d.checklistOpen || {};
      // Only keep quiz answers for modules the moderator has already completed.
      // Incomplete modules should start fresh — not show prior session selections.
      if(ME && ME.doneIds){
        Object.keys(quizAnswers).forEach(id => { if(!ME.doneIds.has(id)) delete quizAnswers[id]; });
      }
    }
    if(d.theme) document.documentElement.setAttribute('data-theme', d.theme);
  }catch(e){}
}

// ── BACKEND HELPERS (GET plain, POST text/plain — see PA setup guide) ───────
async function apiGet(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('GET '+r.status);
  const t = await r.text();
  let d; try{ d = JSON.parse(t); }catch(e){ return []; }
  return Array.isArray(d) ? d : (d.value || []);
}
function normDirRow(u){
  const pick = (keys)=>{ for(const k of keys){ if(u[k]!==undefined && u[k]!==null && String(u[k]).trim()!=='') return u[k]; } return ''; };
  return {
    email: String(pick(['email','Email','EMAIL'])).trim().toLowerCase(),
    name: pick(['name','Name','NAME']),
    role: (pick(['role','Role','ROLE'])||'moderator').toString().toLowerCase(),
    cohort: pick(['cohort','Cohort','COHORT']),
    loc: pick(['locale','Locale','LOCALE']),
    active: (pick(['active','Active','ACTIVE'])||'yes').toString().toLowerCase()
  };
}

function loadData(){
  if(_loadPromise) return _loadPromise;
  _loadPromise = (async () => {
    if(LIVE){

}

async function saveProgress(moduleId, status, score){
  if(!LIVE || !/^https?:\/\//.test(BACKEND.saveProgress)) return;
  try{
    const _dur = moduleStartTimes[moduleId]
      ? Math.max(1, Math.round((Date.now() - moduleStartTimes[moduleId]) / 1000))
      : null;
    const res = await fetch(BACKEND.saveProgress, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({email: ME.email, moduleId, status, score: (score==null?'':score), duration: _dur})});
    // Fire-and-forget by design (a failed save just means the moderator
    // re-does that checkbox next load) -- but DO log the HTTP status, since
    // fetch() only rejects on a network-level failure, never on a PA flow
    // returning 400/401/etc. Without this, a misconfigured flow (wrong
    // table binding, wiped Advanced Parameters after a Save-As clone) fails
    // 100% silently -- the UI still shows progress because doneIds is
    // updated in-memory regardless of whether the write actually landed.
    if(!res.ok){
      console.warn('[Sesame] saveProgress returned', res.status, '-- check the SaveProgress flow (Table binding / Advanced Parameters / trigger set to Anyone). Progress is NOT confirmed saved to Excel.', {moduleId, status, score});
    } else {
      console.log('[Sesame] saveProgress OK for', moduleId);
    }
  }catch(e){ console.error('[Sesame] saveProgress network failure (CORS, DNS, or offline) for', moduleId, ':', e); }
}
function progressFor(email){
  if(LIVE && window._PROGRESS){
    const rows = window._PROGRESS.filter(r => String(r.Email||r.email||'').toLowerCase() === email.toLowerCase());
    const doneIds = new Set(rows.filter(r => String(r.Status||r.status||'')==='done' && VALID_IDS.has(r.ModuleID||r.moduleId)).map(r=>r.ModuleID||r.moduleId));
    const finalRow = rows.find(r => (r.ModuleID||r.moduleId) === 'final_check');
    const finalScore = finalRow ? Number(finalRow.Score||finalRow.score||0) : null;
    return {doneIds, finalScore};
  }
  // demo mode: derive a plausible in-progress state for the test moderator
  if(email === 'demo.mod@centific.com'){
    return {doneIds: new Set(['welcome','centific']), finalScore: null};
  }
  return {doneIds: new Set(), finalScore: null};
}
function buildCohortRow(r){
  const p = progressFor(r.email);
  const totalReal = MODULES.length;
  const certified = p.doneIds.size >= totalReal && p.finalScore !== null && p.finalScore >= FINAL_CHECK_PASS_PCT;
  let status = 'not_started';
  if(p.doneIds.size > 0) status = 'in_progress';
  if(p.doneIds.size >= totalReal && (p.finalScore === null || p.finalScore < FINAL_CHECK_PASS_PCT)) status = 'awaiting_final';
  if(certified) status = 'certified';
  const rawRows = (LIVE && window._PROGRESS)
    ? window._PROGRESS.filter(pr => String(pr.Email||pr.email||'').toLowerCase() === r.email.toLowerCase())
    : [];
  const mods = MODULES.map(m => {
    const prog = rawRows.find(pr => (pr.ModuleID||pr.moduleId) === m.id);
    return {id: m.id, completed: prog ? String(prog.Status||prog.status||'')==='done' : false, score: prog ? Number(prog.Score||prog.score||0) : 0, duration: prog ? (Number(prog.Duration || prog.duration) || null) : null};
  });
  return {email:r.email, name:r.name, cohort:r.cohort, loc:r.loc, done:p.doneIds.size, finalScore:p.finalScore, status, certified, mods};
}

function isCertified(){ return allModulesDone() && ME.finalScore !== null && ME.finalScore >= FINAL_CHECK_PASS_PCT; }

function vModule(){

// -- 'none' gate: real, finished content with no comprehension check by
// design (e.g. the Welcome module) -- just an explicit "mark complete" step
// so it still participates in gating/progress like every other module.
function renderNoneGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Completed</div></div>`;
  }
  return `<div class="stub-gate">
    <button class="btn btn-primary" style="width:auto;" onclick="completeNone('${m.id}')">Continue &rarr;</button>
  </div>`;
}
function completeNone(id){
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget -- don't block the UI on a slow PA response
  renderView();
}

// -- stub gate (blocked modules): single acknowledgement checkbox --
function renderStubGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Reviewed</div></div>`;
  }
  const checked = !!stubChecked[m.id];
  return `<div class="stub-gate">
    <div class="locked-note" style="margin-top:0;margin-bottom:14px;">&#9432; This module's full content is still being finalized (see the amber notes above). This is a placeholder gate — it will be replaced with a real knowledge check once the content lands, without resetting your progress.</div>
    <label class="stub-check" onclick="event.preventDefault();toggleStub('${m.id}')">
      <div class="stub-box${checked?' on':''}"></div>
      <div class="stub-label">I've reviewed this section.</div>
    </label>

  </div>`;
}
function toggleStub(id){ stubChecked[id] = !stubChecked[id]; persistLocal(); renderView(); }
function completeStub(id){
  if(!stubChecked[id]) return;
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget
  toast('Section marked complete.');
  renderView();
}

// -- real per-module quiz (one question at a time, must-get-right-to-advance).
// quizAnswers only ever stores a CORRECT pick -- a wrong pick is tracked
// separately in quizWrongPick so the person can retry without ever being
// shown which option was correct. Once done, options render as frozen,
// non-interactive divs so reviewing never changes what was submitted.
function renderQuiz(m, done){
  const qs = getModQuestions(m.id);
  if(qs.length === 0){
    // safety net: a real module with no quiz defined yet behaves like a stub
    return renderStubGate(m, done);
  }
  if(!quizIdx[m.id]) quizIdx[m.id] = 0;
  if(!quizAnswers[m.id]) quizAnswers[m.id] = {};
  const idx = quizIdx[m.id];
  const q = qs[idx];
  const wrongKey = m.id+':'+idx;
  const correctPick = quizAnswers[m.id][idx]; // undefined until they get it right
  const answeredCorrectly = correctPick !== undefined;
  const justWrong = quizWrongPick[wrongKey];
  const allAnswered = qs.every((_,i)=> quizAnswers[m.id][i] !== undefined);
  const dots = qs.map((_,i)=>{
    const ans = quizAnswers[m.id][i] !== undefined;
    return `<div class="quiz-dot${i===idx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpQuizQ('${m.id}',${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const frozen = done || answeredCorrectly;
  const opts = q.opts.map((o,oi)=>{
    let cls = 'quiz-opt';
    if(answeredCorrectly && oi===q.a) cls += ' correct';
    else if(!answeredCorrectly && justWrong===oi) cls += ' incorrect';
    // Once correct (or the module is already done), freeze the question --
    // render as plain divs instead of buttons so nothing further can change
    // what was actually submitted. While still wrong, keep every option
    // clickable so the person can keep trying.
    return frozen
      ? `<div class="${cls}" style="cursor:default;">${o}</div>`
      : `<button class="${cls}" onclick="answerQuiz('${m.id}',${idx},${oi})">${o}</button>`;
  }).join('');
  let fb = '';
  if(answeredCorrectly){
    fb = `<div class="quiz-fb correct">&#10003; Correct.</div>`;
  } else if(justWrong !== undefined){
    fb = `<div class="quiz-fb incorrect">&#10007; Not quite — give it another try.</div>`;
  } else if(done){
    fb = `<div class="quiz-fb">Answer not available to review on this device.</div>`;
  }
  const backBtn = idx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevQuizQ('${m.id}')">&larr; Back</button>` : '';
  let nav;
  if(done){
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : '';
  } else {
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answeredCorrectly?'':'disabled'} onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${allAnswered?'':'disabled'} onclick="completeQuiz('${m.id}')">Finish module &rarr;</button>`;
  }
  const progressLine = done
    ? `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length} &middot; <span style="color:var(--green-text);font-weight:600;">&#10003; Completed</span></div>`
    : `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length}</div>`;
  return `<div class="quiz-card">
    ${progressLine}
    <div class="quiz-dots">${dots}</div>
    <div class="quiz-q">${q.q}</div>
    ${opts}${fb}
    <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn}${nav}</div>
  </div>`;
}
function answerQuiz(id, qi, oi){
  const qs = getModQuestions(id);
  const q = qs[qi];
  const key = id+':'+qi;
  if(oi === q.a){
    quizAnswers[id][qi] = oi;
    delete quizWrongPick[key];
    persistLocal();
  } else {
    quizWrongPick[key] = oi;
  }
  renderView();
}
function nextQuizQ(id, total){ quizIdx[id] = Math.min(total-1, (quizIdx[id]||0)+1); renderView(); }
function prevQuizQ(id){ quizIdx[id] = Math.max(0, (quizIdx[id]||0)-1); renderView(); }
function jumpQuizQ(id, i){ if(quizAnswers[id] && quizAnswers[id][i] !== undefined){ quizIdx[id] = i; renderView(); } }
function completeQuiz(id){
  const qs = getModQuestions(id);
  const answers = quizAnswers[id] || {};
  const correct = qs.filter((q,i) => answers[i] === q.a).length;
  const pct = qs.length > 0 ? Math.round((correct / qs.length) * 100) : 0;
  ME.doneIds.add(id);
  saveProgress(id, 'done', pct); // fire-and-forget
  toast('Module complete.');
  renderView();
}

// ── FINAL CHECK (score-gated certification exam) ────────────────────────────
function openFinalCheck(){
  if(!isCertified() && getFinalAttempts() >= FINAL_CHECK_MAX_ATTEMPTS){
    toast('All 3 attempts used — your Project Manager will follow up to arrange next steps.');
    return;
  }
  finalMode='inprogress'; finalIdx=0; finalAnswers={}; finalResult=null; VIEW='final'; renderNavTabsForFinal();
}
function renderNavTabsForFinal(){
  document.getElementById('content').innerHTML = vFinal();
  window.scrollTo(0,0);
}
function vFinal(){
  if(finalMode==='result'){
    const pass = finalResult.pct >= FINAL_CHECK_PASS_PCT;
    const attemptsUsed = finalResult.attempts || getFinalAttempts();
    const attemptsLeft = FINAL_CHECK_MAX_ATTEMPTS - attemptsUsed;
    const exhausted = !pass && attemptsLeft <= 0;
    let statusCallout;
    if(pass){
      statusCallout = `<div class="callout"><div class="c-ic">&#9733;</div><div class="c-tx">You're cleared for on-site training. Your Project Manager will confirm the date.</div></div>`;
    } else if(exhausted){
      statusCallout = `<div class="callout danger"><div class="c-ic">&#9888;</div><div class="c-tx"><strong>That was your third and final attempt.</strong> Your Project Manager will follow up directly to arrange a review or a retake — the app won't open a fourth attempt on its own.</div></div>`;
    } else {
      statusCallout = `<div class="callout warn"><div class="c-ic">&#9888;</div><div class="c-tx">Attempt ${attemptsUsed} of ${FINAL_CHECK_MAX_ATTEMPTS}. Review the modules above and try again — you have ${attemptsLeft} attempt${attemptsLeft===1?'':'s'} left.</div></div>`;
    }
    return `<div class="module-page">
      <div class="r-eyebrow">Final Check &middot; Attempt ${attemptsUsed} of ${FINAL_CHECK_MAX_ATTEMPTS}</div>
      <div class="r-title">${pass ? 'Passed' : 'Not yet'} &middot; ${finalResult.pct}%</div>
      <div class="r-sub">${finalResult.correct} of ${finalResult.total} correct &middot; ${FINAL_CHECK_PASS_PCT}% needed to pass</div>
      ${statusCallout}
      <button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="backToPath()">Back to Learning Path</button>
      ${(!pass && !exhausted)?'<button class="btn btn-primary" style="width:auto;margin-top:14px;margin-left:10px;" onclick="openFinalCheck()">Retake &rarr;</button>':''}
    </div>`;
  }
  const q = FINAL_CHECK[finalIdx];
  const picked = finalAnswers[finalIdx];
  const answered = picked !== undefined;
  const dots = FINAL_CHECK.map((_,i)=>{
    const ans = finalAnswers[i] !== undefined;
    return `<div class="quiz-dot${i===finalIdx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpFinal(${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const opts = q.opts.map((o,oi)=>{
    let cls='quiz-opt';
    if(answered){ if(oi===q.a) cls+=' correct'; else if(oi===picked) cls+=' incorrect'; }
    return `<button class="${cls}" onclick="answerFinal(${oi})">${o}</button>`;
  }).join('');
  const fbClass2 = answered ? (picked===q.a ? ' correct' : ' incorrect') : '';
  const fb = answered ? `<div class="quiz-fb${fbClass2}">${picked===q.a?'&#10003; Correct.':'&#10007; Not quite — the highlighted option is correct.'}</div>` : '';
  const backBtn2 = finalIdx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevFinal()">&larr; Back</button>` : '';
  const nav = finalIdx < FINAL_CHECK.length-1
    ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="nextFinal()">Next &rarr;</button>`
    : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="submitFinal()">See result &rarr;</button>`;
  return `<div class="module-page">
    <div class="r-eyebrow">Final Check &middot; question ${finalIdx+1} of ${FINAL_CHECK.length}</div>
    <div class="r-title" style="font-size:20px;">Scenario check</div>
    <div class="quiz-card">
      <div class="quiz-dots">${dots}</div>
      <div class="quiz-q">${q.q}</div>
      ${opts}${fb}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn2}${nav}</div>
    </div>
  </div>`;
}
function answerFinal(oi){ finalAnswers[finalIdx]=oi; renderNavTabsForFinal(); }
function nextFinal(){ finalIdx = Math.min(FINAL_CHECK.length-1, finalIdx+1); renderNavTabsForFinal(); }
function prevFinal(){ finalIdx = Math.max(0, finalIdx-1); renderNavTabsForFinal(); }
function jumpFinal(i){ if(finalAnswers[i] !== undefined){ finalIdx = i; renderNavTabsForFinal(); } }
function submitFinal(){
  let correct=0;
  FINAL_CHECK.forEach((q,i)=>{ if(finalAnswers[i]===q.a) correct++; });
  const pct = Math.round((correct/FINAL_CHECK.length)*100);
  const attempts = incFinalAttempts();
  finalResult = {correct, total: FINAL_CHECK.length, pct, attempts};
  ME.finalScore = pct;
  saveProgress('final_check', 'done', pct); // fire-and-forget
  finalMode = 'result';
  renderNavTabsForFinal();
}

// ── ADMIN DASHBOARD ──────────────────────────────────────────────────────────
function vDash(){
  const total = COHORT.length;
  const certified = COHORT.filter(c=>c.status==='certified').length;
  const inProgress = COHORT.filter(c=>c.status==='in_progress').length;
  const awaitingFinal = COHORT.filter(c=>c.status==='awaiting_final').length;
  const completionTimes = COHORT.flatMap(r =>
    (r.mods||[]).filter(m => m.duration && m.duration > 0).map(m => m.duration)
  );
  const avgTime = completionTimes.length
    ? fmtDur(Math.round(completionTimes.reduce((a,b)=>a+b,0)/completionTimes.length))
    : '—';
  const filtered = COHORT.filter(c => adminFilter==='all' ? true : c.status===adminFilter);
  const rows = filtered.map(c => {
    const pct = Math.round((c.done/MODULES.length)*100);
    const pillMap = {not_started:['pill-gray','Not started'], in_progress:['pill-blue','In progress'], awaiting_final:['pill-amber','Awaiting final check'], certified:['pill-green','Certified']};
    const [pc,pt] = pillMap[c.status];
    const totalSec = (c.mods||[]).reduce((s,m)=>s+(Number(m.duration)||0),0);
    return `<tr style="cursor:pointer" onclick="openModDetail('${c.email}')" title="View ${c.name}'s progress">
      <td><div class="mod-row-name"><div class="mod-avatar">${c.name.charAt(0)}</div><div><div style="font-weight:600;">${c.name}</div><div style="font-size:11.5px;color:var(--text3);">${c.email}</div></div></div></td>
      <td>${c.done} / ${MODULES.length} (${pct}%)</td>
      <td>${c.finalScore===null?'—':c.finalScore+'%'}</td>
      <td><span class="pill ${pc}">${pt}</span></td>
      <td>${totalSec > 0 ? fmtDur(totalSec) : '—'}</td>
    </tr>`;
  }).join('');
  const nowTs = Date.now();
  const diffSec = adminLastRefresh ? Math.round((nowTs - adminLastRefresh) / 1000) : null;
  const lastUpdStr = diffSec === null ? '' : diffSec < 5 ? 'just now' : diffSec < 60 ? diffSec + 's ago' : Math.floor(diffSec/60) + 'min ago';
  return `<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px">
    <h1 class="page-h1" style="margin:0">Cohort Dashboard</h1>
    <span style="margin-left:auto;font-size:12px;color:var(--text3)">${lastUpdStr ? 'Updated ' + lastUpdStr : ''}</span>
    <button id="adminRefreshBtn" class="btn-ghost" onclick="adminRefreshBtn()" style="padding:4px 10px;font-size:12px;border-radius:7px" title="Fetch latest data from Excel">&#8635; Refresh</button>
  </div>
  <p class="page-sub" style="margin-top:4px">Sesame moderators &middot; onboarding progress</p>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-val">${total}</div><div class="kpi-lbl">Enrolled</div></div>
    <div class="kpi-card"><div class="kpi-val">${inProgress}</div><div class="kpi-lbl">In progress</div></div>
    <div class="kpi-card"><div class="kpi-val">${awaitingFinal}</div><div class="kpi-lbl">Awaiting final check</div></div>
    <div class="kpi-card"><div class="kpi-val">${certified}</div><div class="kpi-lbl">Certified</div></div>
    <div class="kpi-card"><div class="kpi-val">${avgTime}</div><div class="kpi-label">Avg. Completion Time</div></div>
  </div>
  <div class="filter-row">
    ${[['all','All'],['in_progress','In progress'],['awaiting_final','Awaiting final'],['certified','Certified']].map(([k,l])=>
      `<button class="filter-chip${adminFilter===k?' active':''}" onclick="setAdminFilter('${k}')">${l}</button>`).join('')}
  </div>
  <div class="card"><div class="admin-tbl-wrap"><table class="admin-tbl"><tr><th>Moderator</th><th>Modules</th><th>Final check</th><th>Status</th><th>Time</th></tr>${rows||'<tr><td colspan="5" style="color:var(--text3);">No moderators match this filter.</td></tr>'}</table></div></div>`;
}
function fmtDur(secs){
  if(!secs || secs <= 0) return '';
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  if(m === 0) return s + 's';
  return s > 0 ? m + 'm ' + s + 's' : m + 'm';
}
function setAdminFilter(f){ adminFilter=f; renderView(); }
function openModDetail(email){ detailEmail=email; VIEW='detail'; renderView(); }

// ── MODERATOR DETAIL VIEW ────────────────────────────────────────────────────
function vModDetail(){

  const pillMap = {not_started:['pill-gray','Not started'], in_progress:['pill-blue','In progress'], awaiting_final:['pill-amber','Awaiting final check'], certified:['pill-green','Certified']};
  const [pc,pt] = pillMap[c.status];
  const totalSec = (c.mods||[]).reduce((s,m)=>s+(Number(m.duration)||0),0);
  const pct = Math.round((c.done/MODULES.length)*100);
  const modRows = MODULES.map((m,i) => {
    const prog = (c.mods||[]).find(p=>p.id===m.id) || {completed:false, score:0, duration:null};
    const done = prog.completed;
    const dur = prog.duration ? `<span style="color:var(--text3);font-size:.8rem;margin-left:6px;">${fmtDur(Number(prog.duration))}</span>` : '';
    const scoreTag = (prog.score && prog.score > 0) ? `<span class="pill pill-blue" style="margin-left:8px;font-size:.75rem;">${prog.score}% quiz</span>` : '';
    const action = done
      ? `<span style="color:var(--accent);font-size:1.1rem;">&#10003;</span>`
      : `<button class="btn-sm" onclick="grantModCredit('${c.email}','${m.id}',\`${m.title.replace(/`/g,"'")}\`)">Grant completion</button>`;
    return `<tr style="border-top:1px solid var(--border)">
      <td style="width:32px;text-align:center;font-size:1.15rem;padding:13px 6px 13px 0">${m.ic}</td>
      <td style="padding:13px 10px">${done?m.title:`<span style="color:var(--text2)">${m.title}</span>`}${scoreTag}${dur}</td>
      <td style="text-align:right;padding:13px 0 13px 10px;white-space:nowrap">${action}</td>
    </tr>`;
  }).join('');
  return `
  <div style="max-width:700px;margin:0 auto">
    <button class="btn-ghost" onclick="VIEW='dash';renderView()" style="margin-bottom:18px">&#8592; Back to dashboard</button>
    <div class="card" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px">
      <div class="mod-avatar" style="width:52px;height:52px;font-size:1.4rem">${c.name.charAt(0)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:1.1rem">${c.name}</div>
        <div style="color:var(--text3);font-size:.85rem">${c.email}${c.cohort?' &middot; Cohort '+c.cohort:''}</div>
      </div>
      <span class="pill ${pc}">${pt}</span>
      ${totalSec>0?`<span style="font-size:.85rem;color:var(--text2)">${fmtDur(totalSec)} total</span>`:''}
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:.85rem;color:var(--text3)">Modules completed</span>
        <span style="font-weight:600">${c.done} / ${MODULES.length}</span>
      </div>
      <div style="height:6px;background:var(--bg3);border-radius:99px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:99px;transition:width .3s"></div>
      </div>
      ${c.finalScore!==null?`<div style="margin-top:8px;font-size:.82rem;color:var(--text2)">Final check: ${c.finalScore}%</div>`:''}
    </div>
    <div class="card">
      <h3 style="font-size:.9rem;font-weight:600;margin:0 0 12px;color:var(--text2)">Module progress</h3>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
      <table style="width:100%;min-width:320px;border-collapse:collapse">
        <colgroup><col style="width:32px"><col><col style="width:150px"></colgroup>
        ${modRows}
      </table>
      </div>
    </div>
  </div>`;
}

async function grantModCredit(email, moduleId, moduleTitle){
  const c = COHORT.find(r=>r.email===email);
  const name = c ? c.name : email;
  if(!confirm(`Grant completion for "${moduleTitle}" to ${name}?`)) return;
  // Always update in-memory immediately so the UI reflects it at once
  const upsertProgress = (arr) => {
    const existing = arr.find(p=>(p.Email||p.email||'').toLowerCase()===email.toLowerCase() && (p.ModuleID||p.moduleId)===moduleId);
    if(existing){ existing.Status='done'; existing.status='done'; }
    else{ arr.push({Email:email, ModuleID:moduleId, Status:'done', Score:'', Duration:null}); }
  };
  if(!window._PROGRESS) window._PROGRESS = [];
  upsertProgress(window._PROGRESS);
  COHORT = DIR.filter(r=>r.role==='moderator').map(r => buildCohortRow(r));
  renderView();
  if(LIVE){
    try{
      await fetch(BACKEND.saveProgress, {method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({email, moduleId, status:'done', score:'', duration:null})});
    }catch(e){ console.error('[Sesame] grantModCredit failed',e); }
  } else {
    toast(`Demo: granted "${moduleTitle}" to ${name}`);
  }
}

function vCurriculum(){
  const rows = MODULES.map((m,i) => {
    const qs = getModQuestions(m.id);
    const editable = qs.length > 0;
    const gateLabel = m.gate==='stub' ? '<span class="pill pill-amber" style="margin-left:6px;">Partial content</span>'
                     : (editable ? '<span class="pill pill-green" style="margin-left:6px;">Ready</span>' : '<span class="pill pill-gray" style="margin-left:6px;">No check</span>');
    const open = !!curriculumEditOpen[m.id];
    return `<div class="res-card" style="cursor:default;flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="res-ic">${m.ic}</div>
        <div class="res-tx" style="flex:1;"><h4>${i+1}. ${m.title} ${gateLabel}</h4><p>~${m.min} min &middot; ${qs.length} question${qs.length===1?'':'s'}</p></div>
        ${editable ? `<button class="btn btn-ghost" onclick="toggleCurriculumEdit('${m.id}')">${open?'Hide':'Edit'} questions</button>` : ''}
      </div>
      ${editable && open ? `<div style="margin-top:14px;">${qs.map((q,qi)=>renderEditableQuestion('mod:'+m.id, qi, q)).join('')}</div>` : ''}
    </div>`;
  }).join('');
  const finalOpen = !!curriculumEditOpen['final'];
  return `<h1 class="page-h1">Curriculum</h1><p class="page-sub">${MODULES.length} modules, sequential and gated &middot; two-layer knowledge check (per-module + final) &middot; ~${TOTAL_MIN} min total</p>
  <div class="callout" style="margin-bottom:18px;"><div class="c-ic">&#9432;</div><div class="c-tx"><strong>Question and answer text below is editable.</strong> Changes save to this browser only until the Curriculum backend is wired — see Dev_Notes.md. <button class="btn btn-ghost" style="margin-left:4px;" onclick="resetCurriculum()">Reset all to defaults</button></div></div>
  ${rows}
  <div class="res-card" style="cursor:default;flex-direction:column;align-items:stretch;margin-top:6px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="res-ic">&#127919;</div>
      <div class="res-tx" style="flex:1;"><h4>Final Check <span class="pill pill-green" style="margin-left:6px;">${FINAL_CHECK.length} of 40 live</span></h4><p>${FINAL_CHECK_PASS_PCT}% to pass &middot; ${FINAL_CHECK_MAX_ATTEMPTS} attempts, then your Project Manager follows up directly</p></div>
      <button class="btn btn-ghost" onclick="toggleCurriculumEdit('final')">${finalOpen?'Hide':'Edit'} questions</button>
    </div>
    ${finalOpen ? `<div style="margin-top:14px;">${FINAL_CHECK.map((q,qi)=>renderEditableQuestion('final', qi, q)).join('')}</div>` : ''}
  </div>`;
}


// ── MODERATOR MANAGEMENT ────────────────────────────────────────────────────
function showToast(m){ toast(m); }

function getLocalMods(){
  try{ return JSON.parse(localStorage.getItem('sesame_local_mods_v1')||'[]'); }catch(e){ return []; }
}
function saveLocalMods(arr){
  try{ localStorage.setItem('sesame_local_mods_v1', JSON.stringify(arr)); }catch(e){}
}
function mergeLocalMods(){
  LOCAL_MODS = getLocalMods();
  LOCAL_MODS.forEach(lm => {
    const idx = DIR.findIndex(d => d.email.toLowerCase() === lm.email.toLowerCase());
    if(idx >= 0){ Object.assign(DIR[idx], lm); }
    else { DIR.push(lm); }
  });
  COHORT = DIR.filter(r=>r.role==='moderator').map(r => buildCohortRow(r));
}
async function submitManageModerator(payload){
  if(!LIVE) return;
  try{
    await fetch(BACKEND.manageModerator, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
  }catch(e){ console.warn('[Sesame] ManageModerator PA call failed (non-blocking)', e); }
}
function addModeratorInApp(name, email, cohort){
  const entry = {name, email:email.toLowerCase(), role:'moderator', cohort, active:'yes', _local:true};
  const idx = DIR.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(idx >= 0){ DIR[idx] = {...DIR[idx], ...entry}; }
  else { DIR.push(entry); }
  const localArr = getLocalMods();
  const li = localArr.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(li >= 0){ localArr[li] = entry; } else { localArr.push(entry); }
  saveLocalMods(localArr);
  COHORT = DIR.filter(r=>r.role==='moderator').map(r=>buildCohortRow(r));
  submitManageModerator({action:'add', name, email:email.toLowerCase(), role:'moderator', cohort, active:'yes'});
  showToast('Moderator added ✓');
  renderView();
}
function deactivateModeratorInApp(email){
  const idx = DIR.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(idx >= 0){ DIR[idx].active = 'no'; }
  const localArr = getLocalMods();
  const li = localArr.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(li >= 0){ localArr[li].active = 'no'; }
  else { localArr.push({email:email.toLowerCase(), active:'no', _deactivate:true}); }
  saveLocalMods(localArr);
  COHORT = DIR.filter(r=>r.role==='moderator').map(r=>buildCohortRow(r));
  submitManageModerator({action:'deactivate', email:email.toLowerCase()});
  showToast('Moderator deactivated');
  renderView();
}
function vModerators(){
  const mods = DIR.filter(r=>r.role==='moderator');
  const active = mods.filter(m=>m.active!=='no');
  const inactive = mods.filter(m=>m.active==='no');
  document.getElementById('app').innerHTML = `
<div class="module-page" style="max-width:860px;margin:0 auto;padding:2rem 1.5rem">

      <div><label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.25rem">Full Name</label>
        <input id="new-mod-name" style="width:100%;box-sizing:border-box;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:.9rem" placeholder="Jane Smith"></div>
      <div><label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.25rem">Email</label>
        <input id="new-mod-email" style="width:100%;box-sizing:border-box;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:.9rem" placeholder="v_jane.smith@centific.com"></div>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:.75rem;align-items:flex-end">
      <div><label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.25rem">Cohort</label>
        <input id="new-mod-cohort" style="width:100%;box-sizing:border-box;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:.9rem" placeholder="A"></div>
      <button class="btn btn-primary" onclick="(function(){const n=document.getElementById('new-mod-name').value.trim(),e=document.getElementById('new-mod-email').value.trim(),c=document.getElementById('new-mod-cohort').value.trim();if(!n||!e){alert('Name and email required');return;}addModeratorInApp(n,e,c);document.getElementById('mod-form').style.display='none';})()">Add Moderator</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-top:1rem">
    <table class="admin-tbl" style="width:100%;border-collapse:collapse">
      <thead><tr><th>Name</th><th>Email</th><th>Cohort</th><th>Status</th><th>Source</th><th></th></tr></thead>
      <tbody>
        ${active.map(m=>`<tr>
          <td><div style="display:flex;align-items:center;gap:10px"><div class="mod-avatar">${m.name.charAt(0).toUpperCase()}</div>${m.name}</div></td>
          <td style="color:var(--text2);font-size:.85rem">${m.email}</td>
          <td>${m.cohort||'—'}</td>
          <td><span style="background:var(--green-bg);color:var(--green-text);padding:.2rem .6rem;border-radius:99px;font-size:.75rem;font-weight:600">Active</span></td>
          <td style="font-size:.75rem;color:var(--text3)">${m._local?'Local':'Excel'}</td>
          <td><button class="btn btn-ghost" style="font-size:.75rem;padding:.25rem .6rem;color:var(--red)" onclick="if(confirm('Deactivate ${m.name}?'))deactivateModeratorInApp('${m.email}')">Deactivate</button></td>
        </tr>`).join('')}
        ${inactive.length?`<tr><td colspan="6" style="padding:.5rem 1rem;background:var(--bg3);font-size:.8rem;color:var(--text3)">Deactivated (${inactive.length})</td></tr>`:''}
        ${inactive.map(m=>`<tr style="opacity:.55">
          <td>${m.name||'—'}</td><td style="font-size:.85rem">${m.email}</td><td>—</td>
          <td><span style="background:var(--bg4);color:var(--text3);padding:.2rem .6rem;border-radius:99px;font-size:.75rem">Inactive</span></td>
          <td style="font-size:.75rem;color:var(--text3)">${m._local?'Local':'Excel'}</td><td></td>
        </tr>`).join('')}
        ${mods.length===0?`<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text3)">No moderators yet — add the first one above.</td></tr>`:''}
      </tbody>
    </table>
  </div>
  <p style="margin-top:1rem;font-size:.8rem;color:var(--text3)">⚠ Changes sync to Power Automate in real-time. Locally-added moderators persist even before the PA flow is configured.</p>
</div>`;
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
// Local-file warning: modern Chrome/Edge block outbound fetch() from a
// file:// origin to remote HTTPS endpoints, so BACKEND calls silently never
// leave the browser when someone double-clicks this file instead of opening
// it from a hosted URL. That looks identical to "the flow is broken" (zero
// Power Automate run history) but is actually a browser restriction, not an
// app or flow bug. Appended to <html> (a sibling of <body>), not inside
// <body>, so it survives every full-body innerHTML re-render.
if(location.protocol === 'file:'){
  const w = document.createElement('div');
  w.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#F59E0B;color:#1a1207;font-family:-apple-system,\'SF Pro Text\',sans-serif;font-size:12.5px;font-weight:600;padding:9px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25);';
  w.textContent = '⚠ Opened as a local file (file://) — network calls to Power Automate are blocked by the browser from this origin, so progress will not sync. Open this from a hosted URL (e.g. GitHub Pages) to test the live backend.';
  document.documentElement.appendChild(w);
}

// Prefetch starts the instant the page loads (not on a click) -- see
// canonical pattern in Verdi_App_Family_Master_Context.md §20.1. If there's
// no auto-resume candidate, show the login screen immediately rather than
// waiting on the network; doLogin() awaits the same in-flight promise.
loadCurriculumOverrides();
if(!getLastLogin()) renderLogin();
loadData().then(() => {
  const last = getLastLogin();
  if(last){
    const rec = findUser(last);
    if(rec){ applyProfile(rec); restoreLocalSession(last); startApp(rec.role); }
    else { renderLogin(); }
  }
});
