// ── LEARNING PATH ────────────────────────────────────────────────────────────
function vPath(){
  const doneCount = MODULES.filter(m=>isModuleDone(m.id)).length;
  const total = MODULES.length;
  const pct = Math.round((doneCount/total)*100);
  const certified = isCertified();
  const allDoneNoFinal = allModulesDone() && !certified;
  let hero;
  if(certified){
    hero = `<div class="hero-box certified"><div class="pill pill-green" style="margin-bottom:10px;">&#10003; Cleared for on-site training</div>
      <div class="hero-title2">You're certified, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">All ${MODULES.length} modules complete and the final check passed at ${ME.finalScore}%. Your Project Manager will confirm your on-site training date.</div></div>`;
  } else if(allDoneNoFinal){
    hero = `<div class="hero-box"><div class="hero-title2">One step left, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">All ${MODULES.length} modules are complete. Pass the final check (${FINAL_CHECK_PASS_PCT}%, up to ${FINAL_CHECK_MAX_ATTEMPTS} attempts) to be cleared for on-site training.</div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <div class="progress-label">${doneCount} of ${total} modules complete</div>
      <button class="btn btn-primary" style="width:auto;margin-top:14px;" onclick="openFinalCheck()">Take the final check &rarr;</button></div>`;
  } else if(doneCount===0){
    hero = `<div class="hero-box"><div class="hero-title2">Welcome — let's get you ready.</div>
      <div class="hero-sub2">${MODULES.length} modules, gated in order, ~${TOTAL_MIN} min total. Every module has a Back button and stays open for revisiting once you've completed it.</div>
      <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
      <div class="progress-label">0 of ${total} modules complete</div></div>`;
  } else {
    hero = `<div class="hero-box"><div class="hero-title2">Welcome back, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">Pick up where you left off.</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${doneCount} of ${total} modules complete</div></div>`;
  }
  const steps = MODULES.map((m,i) => {
    const done = isModuleDone(m.id);
    const unlocked = moduleUnlocked(i);
    const current = unlocked && !done;
    const dotClass = done ? 'done' : (current ? 'current' : 'locked');
    const dotContent = done ? '&#10003;' : (i+1);
    const clickable = unlocked;
    return `<div class="step-row${clickable?' clickable':''}" ${clickable?`onclick="openModule(${i})"`:''}>
      <div class="step-dot ${dotClass}">${dotContent}</div>
      <div class="step-body">
        <div class="step-title${unlocked?'':' locked'}">${m.ic} ${m.title}${m.gate==='stub'?' <span class=\"pill pill-amber\" style=\"margin-left:6px;\">Partial</span>':''}</div>
        <div class="step-meta">${unlocked ? ('~'+m.min+' min &middot; '+(done?'Completed':'Not started')) : 'Locked — complete the previous module'}</div>
      </div>
    </div>`;
  }).join('');
  return `<h1 class="page-h1">My Learning Path</h1><p class="page-sub">${doneCount} of ${total} complete &middot; ~${TOTAL_MIN} min total</p>
  ${hero}<div class="card"><div class="stepper">${steps}</div></div>`;
}

function openModule(i){ CUR_MOD = i; VIEW = 'module'; renderNavTabs(); renderView(); window.scrollTo(0,0); }
function backToPath(){ VIEW='path'; renderNavTabs(); renderView(); window.scrollTo(0,0); }
function continueFromModule(){
  if(CUR_MOD < MODULES.length-1){ openModule(CUR_MOD+1); }
  else { backToPath(); }
}

// ── MODULE VIEWER ────────────────────────────────────────────────────────────
function vModule(){
  const m = MODULES[CUR_MOD];
  const done = isModuleDone(m.id);
  const isLast = CUR_MOD === MODULES.length-1;
  let gate;
  if(m.gate === 'none'){
    gate = renderNoneGate(m, done);
  } else if(m.gate === 'stub'){
    gate = renderStubGate(m, done);
  } else {
    gate = renderQuiz(m, done);
  }
  return `<div class="module-page">
    <div class="r-eyebrow">Module ${CUR_MOD+1} of ${MODULES.length}</div>
    <div class="r-title">${m.ic} ${m.title}</div>
    <div class="r-sub">${m.sub}</div>
    <div class="r-meta">~${m.min} min${m.gate==='stub'?' &middot; content still being finalized — see amber notes below':''}</div>
    <div class="reader">${m.body}</div>
    ${gate}
    <div class="mod-nav-row">
      <button class="btn btn-ghost" onclick="backToPath()">&larr; Back to path</button>
      ${done ? `<button class="btn btn-secondary" onclick="continueFromModule()">${isLast ? 'Back to path' : 'Continue to next module'} &rarr;</button>` : ''}
    </div>
  </div>`;
}

// -- 'none' gate: real, finished content with no comprehension check by
// design (e.g. the Welcome module) -- just an explicit "mark complete" step
// so it still participates in gating/progress like every other module.
function renderNoneGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Completed</div></div>`;
  }
  return `<div class="stub-gate">
    <button class="btn btn-primary" style="width:auto;" onclick="completeNone('${m.id}')">Continue &rarr;</button>
  </div>`;
}
function completeNone(id){
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget -- don't block the UI on a slow PA response
  renderView();
}

// -- stub gate (blocked modules): single acknowledgement checkbox --
function renderStubGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Reviewed</div></div>`;
  }
  const checked = !!stubChecked[m.id];
  return `<div class="stub-gate">
    <div class="locked-note" style="margin-top:0;margin-bottom:14px;">&#9432; This module's full content is still being finalized (see the amber notes above). This is a placeholder gate — it will be replaced with a real knowledge check once the content lands, without resetting your progress.</div>
    <label class="stub-check" onclick="event.preventDefault();toggleStub('${m.id}')">
      <div class="stub-box${checked?' on':''}"></div>
      <div class="stub-label">I've reviewed this section.</div>
    </label>
    <button class="btn btn-primary" style="width:auto;margin-top:14px;" ${checked?'':'disabled'} onclick="completeStub('${m.id}')">Mark complete &amp; continue &rarr;</button>
  </div>`;
}
function toggleStub(id){ stubChecked[id] = !stubChecked[id]; persistLocal(); renderView(); }
function completeStub(id){
  if(!stubChecked[id]) return;
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget
  toast('Section marked complete.');
  renderView();
}

// -- real per-module quiz (one question at a time, flagged not blocking).
// Same single-question view whether or not the module is already done --
// once done, options just stop being clickable and the Finish button is
// replaced with a "Completed" pill. Back/dot-jump navigation always works,
// so reviewing past answers never expands into a big list.
function renderQuiz(m, done){
  const qs = getModQuestions(m.id);
  if(qs.length === 0){
    // safety net: a real module with no quiz defined yet behaves like a stub
    return renderStubGate(m, done);
  }
  if(!quizIdx[m.id]) quizIdx[m.id] = 0;
  if(!quizAnswers[m.id]) quizAnswers[m.id] = {};
  const idx = quizIdx[m.id];
  const q = qs[idx];
  const picked = quizAnswers[m.id][idx];
  const answered = picked !== undefined;
  const allAnswered = qs.every((_,i)=> quizAnswers[m.id][i] !== undefined);
  const dots = qs.map((_,i)=>{
    const ans = quizAnswers[m.id][i] !== undefined;
    return `<div class="quiz-dot${i===idx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpQuizQ('${m.id}',${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const opts = q.opts.map((o,oi)=>{
    let cls = 'quiz-opt';
    if(answered){
      if(oi===q.a) cls += ' correct';
      else if(oi===picked) cls += ' incorrect';
    }
    // Once the module is done, answers are committed -- render as plain,
    // non-interactive divs instead of buttons so reviewing never changes
    // what was actually submitted.
    return done
      ? `<div class="${cls}" style="cursor:default;">${o}</div>`
      : `<button class="${cls}" onclick="answerQuiz('${m.id}',${idx},${oi})">${o}</button>`;
  }).join('');
  const fbClass = answered ? (picked===q.a ? ' correct' : ' incorrect') : '';
  const fb = answered ? `<div class="quiz-fb${fbClass}">${picked===q.a ? '&#10003; Correct.' : '&#10007; Not quite — the highlighted option is correct.'}</div>` : (done ? `<div class="quiz-fb">Answer not available to review on this device.</div>` : '');
  const backBtn = idx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevQuizQ('${m.id}')">&larr; Back</button>` : '';
  let nav;
  if(done){
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : '';
  } else {
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${allAnswered?'':'disabled'} onclick="completeQuiz('${m.id}')">Finish module &rarr;</button>`;
  }
  const progressLine = done
    ? `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length} &middot; <span style="color:var(--green-text);font-weight:600;">&#10003; Completed</span></div>`
    : `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length}</div>`;
  return `<div class="quiz-card">
    ${progressLine}
    <div class="quiz-dots">${dots}</div>
    <div class="quiz-q">${q.q}</div>
    ${opts}${fb}
    <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn}${nav}</div>
  </div>`;
}
function answerQuiz(id, qi, oi){ quizAnswers[id][qi] = oi; persistLocal(); renderView(); }
function nextQuizQ(id, total){ quizIdx[id] = Math.min(total-1, (quizIdx[id]||0)+1); renderView(); }
function prevQuizQ(id){ quizIdx[id] = Math.max(0, (quizIdx[id]||0)-1); renderView(); }
function jumpQuizQ(id, i){ if(quizAnswers[id] && quizAnswers[id][i] !== undefined){ quizIdx[id] = i; renderView(); } }
function completeQuiz(id){
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget
  toast('Module complete.');
  renderView();
}

// ── FINAL CHECK (score-gated certification exam) ────────────────────────────
function openFinalCheck(){
  if(!isCertified() && getFinalAttempts() >= FINAL_CHECK_MAX_ATTEMPTS){
    toast('All 3 attempts used — your Project Manager will follow up to arrange next steps.');
    return;
  }
  finalMode='inprogress'; finalIdx=0; finalAnswers={}; finalResult=null; VIEW='final'; renderNavTabsForFinal();
}
function renderNavTabsForFinal(){
  document.getElementById('content').innerHTML = vFinal();
  window.scrollTo(0,0);
}
function vFinal(){
  if(finalMode==='result'){
    const pass = finalResult.pct >= FINAL_CHECK_PASS_PCT;
    const attemptsUsed = finalResult.attempts || getFinalAttempts();
    const attemptsLeft = FINAL_CHECK_MAX_ATTEMPTS - attemptsUsed;
    const exhausted = !pass && attemptsLeft <= 0;
    let statusCallout;
    if(pass){
      statusCallout = `<div class="callout"><div class="c-ic">&#9733;</div><div class="c-tx">You're cleared for on-site training. Your Project Manager will confirm the date.</div></div>`;
    } else if(exhausted){
      statusCallout = `<div class="callout danger"><div class="c-ic">&#9888;</div><div class="c-tx"><strong>That was your third and final attempt.</strong> Your Project Manager will follow up directly to arrange a review or a retake — the app won't open a fourth attempt on its own.</div></div>`;
    } else {
      statusCallout = `<div class="callout warn"><div class="c-ic">&#9888;</div><div class="c-tx">Attempt ${attemptsUsed} of ${FINAL_CHECK_MAX_ATTEMPTS}. Review the modules above and try again — you have ${attemptsLeft} attempt${attemptsLeft===1?'':'s'} left.</div></div>`;
    }
    return `<div class="module-page">
      <div class="r-eyebrow">Final Check &middot; Attempt ${attemptsUsed} of ${FINAL_CHECK_MAX_ATTEMPTS}</div>
      <div class="r-title">${pass ? 'Passed' : 'Not yet'} &middot; ${finalResult.pct}%</div>
      <div class="r-sub">${finalResult.correct} of ${finalResult.total} correct &middot; ${FINAL_CHECK_PASS_PCT}% needed to pass</div>
      ${statusCallout}
      <button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="backToPath()">Back to Learning Path</button>
      ${(!pass && !exhausted)?'<button class="btn btn-primary" style="width:auto;margin-top:14px;margin-left:10px;" onclick="openFinalCheck()">Retake &rarr;</button>':''}
    </div>`;
  }
  const q = FINAL_CHECK[finalIdx];
  const picked = finalAnswers[finalIdx];
  const answered = picked !== undefined;
  const dots = FINAL_CHECK.map((_,i)=>{
    const ans = finalAnswers[i] !== undefined;
    return `<div class="quiz-dot${i===finalIdx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpFinal(${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const opts = q.opts.map((o,oi)=>{
    let cls='quiz-opt';
    if(answered){ if(oi===q.a) cls+=' correct'; else if(oi===picked) cls+=' incorrect'; }
    return `<button class="${cls}" onclick="answerFinal(${oi})">${o}</button>`;
  }).join('');
  const fbClass2 = answered ? (picked===q.a ? ' correct' : ' incorrect') : '';
  const fb = answered ? `<div class="quiz-fb${fbClass2}">${picked===q.a?'&#10003; Correct.':'&#10007; Not quite — the highlighted option is correct.'}</div>` : '';
  const backBtn2 = finalIdx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevFinal()">&larr; Back</button>` : '';
  const nav = finalIdx < FINAL_CHECK.length-1
    ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="nextFinal()">Next &rarr;</button>`
    : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="submitFinal()">See result &rarr;</button>`;
  return `<div class="module-page">
    <div class="r-eyebrow">Final Check &middot; question ${finalIdx+1} of ${FINAL_CHECK.length}</div>
    <div class="r-title" style="font-size:20px;">Scenario check</div>
    <div class="quiz-card">
      <div class="quiz-dots">${dots}</div>
      <div class="quiz-q">${q.q}</div>
      ${opts}${fb}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn2}${nav}</div>
    </div>
  </div>`;
}
function answerFinal(oi){ finalAnswers[finalIdx]=oi; renderNavTabsForFinal(); }
function nextFinal(){ finalIdx = Math.min(FINAL_CHECK.length-1, finalIdx+1); renderNavTabsForFinal(); }
function prevFinal(){ finalIdx = Math.max(0, finalIdx-1); renderNavTabsForFinal(); }
function jumpFinal(i){ if(finalAnswers[i] !== undefined){ finalIdx = i; renderNavTabsForFinal(); } }
function submitFinal(){
  let correct=0;
  FINAL_CHECK.forEach((q,i)=>{ if(finalAnswers[i]===q.a) correct++; });
  const pct = Math.round((correct/FINAL_CHECK.length)*100);
  const attempts = incFinalAttempts();
  finalResult = {correct, total: FINAL_CHECK.length, pct, attempts};
  ME.finalScore = pct;
  saveProgress('final_check', 'done', pct); // fire-and-forget
  finalMode = 'result';
  renderNavTabsForFinal();
}

function showToast(m){ toast(m); }

function getLocalMods(){

  LOCAL_MODS = getLocalMods();

  if(!LIVE) return;
  try{
    await fetch(BACKEND.manageModerator, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload)
    });
  }catch(e){ console.warn('[Sesame] ManageModerator PA call failed (non-blocking)', e); }
}
function addModeratorInApp(name, email, cohort){
  const entry = {name, email:email.toLowerCase(), role:'moderator', cohort, active:'yes', _local:true};
  const idx = DIR.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(idx >= 0){ DIR[idx] = {...DIR[idx], ...entry}; }
  else { DIR.push(entry); }
  const localArr = getLocalMods();
  const li = localArr.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(li >= 0){ localArr[li] = entry; } else { localArr.push(entry); }
  saveLocalMods(localArr);
  COHORT = DIR.filter(r=>r.role==='moderator').map(r=>buildCohortRow(r));
  submitManageModerator({action:'add', name, email:email.toLowerCase(), cohort});
  showToast('Moderator added ✓');
  renderView();
}
function deactivateModeratorInApp(email){
  const idx = DIR.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(idx >= 0){ DIR[idx].active = 'no'; }
  const localArr = getLocalMods();
  const li = localArr.findIndex(d => d.email.toLowerCase() === email.toLowerCase());
  if(li >= 0){ localArr[li].active = 'no'; }
  else { localArr.push({email:email.toLowerCase(), active:'no', _deactivate:true}); }
  saveLocalMods(localArr);
  COHORT = DIR.filter(r=>r.role==='moderator').map(r=>buildCohortRow(r));
  submitManageModerator({action:'deactivate', email:email.toLowerCase()});
  showToast('Moderator deactivated');
  renderView();
}

        <input id="new-mod-name" style="width:100%;box-sizing:border-box;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:.9rem" placeholder="Jane Smith"></div>
      <div><label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.25rem">Email</label>
        <input id="new-mod-email" style="width:100%;box-sizing:border-box;padding:.5rem .75rem;border-radius:6px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:.9rem" placeholder="jane.smith@centific.com"></div>

      <div><label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.25rem">Cohort</label>

      <button class="btn btn-primary" onclick="(function(){const n=document.getElementById('new-mod-name').value.trim(),e=document.getElementById('new-mod-email').value.trim(),c=document.getElementById('new-mod-cohort').value.trim();if(!n||!e){alert('Name and email required');return;}addModeratorInApp(n,e,c);document.getElementById('mod-form').style.display='none';})()">Add Moderator</button>

  <div class="card" style="padding:0;overflow:hidden;margin-top:1rem">
