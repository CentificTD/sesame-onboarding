<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<title>Sesame · Moderator Onboarding</title>
<style>
:root{
  --accent:#B8926A; --accent-dim:#9A7854; --accent-soft:rgba(184,146,106,0.15); --accent-ink:#B8926A;
  --amber:#B8926A; --amber-bg:#FBF6EE; --amber-text:#5C3D1A; --amber-border:#d4b896;
  --green:#22c55e; --green-bg:#EAF3DE; --green-text:#27500A;
  --red:#ef4444; --red-bg:#FEF2F2; --red-text:#991b1b;
  --blue:#3b82f6; --blue-bg:#EFF6FF; --blue-text:#1e3a8a;
  --font:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --font-num:'Avenir Next','Avenir','SF Pro Display',-apple-system,sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12100E; --bg2:#1C1814; --bg3:#252119; --bg4:#302C25;
  --text:#EFE8DC; --text2:#B8A08A; --text3:#7A6C5A;
  --border:#221E18; --border-strong:#352F26;
  --input-bg:#1C1814; --card-bg:#1C1814; --nav-bg:rgba(18,16,14,0.92); --sidebar-bg:#1C1814;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.50); --shadow-md:0 8px 40px rgba(0,0,0,0.62); --shadow-lg:0 20px 60px rgba(0,0,0,0.72);
  --accent-ink:#D4A87A;
  --bg-glow:#2A1E10;
  --bg-glow2:#1E1A12;
  --seed-op:1;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F3EC; --bg2:#FDFBF7; --bg3:#EDE8DE; --bg4:#E0D9CC;
  --text:#2C241A; --text2:#6B5840; --text3:#9C8B76;
  --border:rgba(100,75,40,0.12); --border-strong:rgba(85,60,25,0.20);
  --input-bg:#EDE8DE; --card-bg:#FDFBF7; --nav-bg:rgba(247,243,236,0.92); --sidebar-bg:#FDFBF7;
  --shadow-sm:0 2px 12px rgba(60,40,10,0.06); --shadow-md:0 8px 40px rgba(60,40,10,0.10); --shadow-lg:0 20px 60px rgba(60,40,10,0.12);
  --accent-ink:#8A6840;
  --bg-glow:#EDD8B8;
  --bg-glow2:#F5ECD8;
  --seed-op:0;
}
*{box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}input:focus{outline:none;}
html,body{margin:0;padding:0;}
/* Sesame seed pattern background (dark mode only, via --seed-op) with amber glows. */
body{
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(5px 1.8px at 8% 16%, rgba(210,188,155,calc(0.10*var(--seed-op))), transparent 100%) 0 0/200px 160px repeat,
    radial-gradient(1.6px 5px at 31% 71%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/280px 220px repeat,
    radial-gradient(4px 1.5px at 73% 42%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/240px 190px repeat,
    radial-gradient(1.4px 4.5px at 88% 25%, rgba(210,188,155,calc(0.07*var(--seed-op))), transparent 100%) 0 0/190px 150px repeat,
    radial-gradient(3.5px 2px at 52% 88%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/260px 200px repeat,
    radial-gradient(2px 3.5px at 19% 45%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/220px 175px repeat,
    radial-gradient(circle at 12% 100%, var(--bg-glow) 0%, transparent 38%),
    radial-gradient(circle at 90% -4%, var(--bg-glow2) 0%, transparent 42%),
    var(--bg);
  background-attachment:fixed;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);}
#login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(5px 1.8px at 8% 16%, rgba(210,188,155,calc(0.10*var(--seed-op))), transparent 100%) 0 0/200px 160px repeat,
    radial-gradient(1.6px 5px at 31% 71%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/280px 220px repeat,
    radial-gradient(4px 1.5px at 73% 42%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/240px 190px repeat,
    radial-gradient(1.4px 4.5px at 88% 25%, rgba(210,188,155,calc(0.07*var(--seed-op))), transparent 100%) 0 0/190px 150px repeat,
    radial-gradient(3.5px 2px at 52% 88%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/260px 200px repeat,
    radial-gradient(2px 3.5px at 19% 45%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/220px 175px repeat,
    radial-gradient(circle at 12% 100%, var(--bg-glow) 0%, transparent 38%),
    radial-gradient(circle at 90% -4%, var(--bg-glow2) 0%, transparent 42%),
    var(--bg);
}
.entry-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:44px 40px 34px;width:100%;max-width:420px;text-align:center;}
.brand-mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;margin:0 auto 18px;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px;}
.entry-title{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px;}
.entry-sub{font-size:14.5px;color:var(--text2);line-height:1.55;margin-bottom:28px;}
.field-label{display:block;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.field-input{width:100%;font-size:15.5px;padding:12px 14px;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;color:var(--text);letter-spacing:-.005em;transition:border-color .18s,box-shadow .18s;}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-input::placeholder{color:var(--text3);}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:left;}
.hint-line{font-size:12.5px;color:var(--text3);margin-top:18px;line-height:1.5;}
.version-tag{font-size:10.5px;color:var(--text3);margin-top:22px;opacity:.7;}
.btn{font-size:15px;font-weight:500;letter-spacing:-.01em;padding:11px 16px;border-radius:12px;border:.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .22s cubic-bezier(.4,0,.2,1);width:100%;}
.btn-primary{background:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{background:var(--bg2);color:var(--text);border:.5px solid var(--border-strong);width:auto;}
.btn-secondary:hover{background:var(--bg4);}
.btn-ghost{background:transparent;color:var(--text2);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.page-wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%;}
.shell{min-height:calc(100vh - 90px);}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 18px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0;}
.nav-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.nav-brand{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-brand span{color:var(--text3);font-weight:400;}
.nav-right{display:flex;align-items:center;gap:12px;}
.who{display:flex;align-items:center;}
.who-text{font-size:13px;line-height:1.4;text-align:right;}
.role-line{color:var(--accent-ink);font-size:11.5px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.icon-btn:hover{background:var(--bg4);color:var(--text);}
.btn-signout{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--border-strong);color:var(--text2);font-size:12.5px;font-weight:600;}
.btn-signout:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.nav-tabs{display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--border);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow-sm);margin-bottom:22px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .2s;flex:1;min-width:fit-content;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;font-weight:600;box-shadow:0 4px 14px var(--accent-soft);}
.content{padding:0 0 60px;min-width:0;overflow-x:hidden;width:100%;}
h1.page-h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;}
.page-sub{font-size:14.5px;color:var(--text2);margin:0 0 24px;line-height:1.5;}
.card{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow-sm);}
.hero-box{background:var(--card-bg);border:.5px solid var(--border);border-radius:20px;padding:26px 28px;margin-bottom:26px;box-shadow:var(--shadow-sm);}
.hero-box.certified{border-color:rgba(34,197,94,.35);}
.hero-title2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px;}
.hero-sub2{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.progress-track{height:8px;border-radius:99px;background:var(--bg4);overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-label{font-size:12.5px;color:var(--text3);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em;}
.pill-green{background:var(--green-bg);color:var(--green-text);border:.5px solid rgba(34,197,94,.3);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border:.5px solid var(--amber-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border:.5px solid rgba(59,130,246,.3);}
.pill-gray{background:var(--bg3);color:var(--text3);border:.5px solid var(--border-strong);}
.stepper{margin-top:6px;}
.step-row{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.step-row:last-child{padding-bottom:0;}
.step-row:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);}
.step-dot{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text3);border:2px solid var(--border-strong);z-index:1;}
.step-dot.locked{opacity:.55;}
.step-dot.current{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.step-dot.done{background:var(--green);color:#fff;border-color:var(--green);}
.step-body{flex:1;padding-top:3px;min-width:0;}
.step-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
.step-title.locked{color:var(--text3);}
.step-meta{font-size:12px;color:var(--text3);}
.step-row.clickable{cursor:pointer;}
.step-row.clickable:hover .step-title{color:var(--accent-ink);}
.module-page{max-width:760px;margin:0 auto;}
.r-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px;}
.r-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;}
.r-sub{font-size:14.5px;color:var(--text2);margin-bottom:8px;}
.r-meta{font-size:12.5px;color:var(--text3);margin-bottom:26px;}
.reader{font-size:15px;line-height:1.72;color:var(--text);}
.reader h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:30px 0 12px;}
.reader h3{font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:24px 0 10px;}
.reader p{margin:0 0 14px;color:var(--text2);}
.reader ul,.reader ol{margin:0 0 14px;padding-left:22px;color:var(--text2);}
.reader li{margin-bottom:7px;line-height:1.6;color:var(--text2);}
.reader strong{color:var(--text);}
.callout{display:flex;gap:11px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:16px 0;}
.callout .c-ic{font-size:16px;line-height:1.4;flex-shrink:0;color:var(--accent-ink);}
.callout .c-tx{font-size:14.5px;line-height:1.6;color:var(--text2);}
.callout .c-tx strong{color:var(--text);}
.callout.warn{border-left-color:var(--amber);}.callout.warn .c-ic{color:var(--amber);}
.callout.danger{border-left-color:var(--red);}.callout.danger .c-ic{color:var(--red);}
.callout.info{border-left-color:var(--blue);}.callout.info .c-ic{color:var(--blue);}
.awaiting{display:flex;gap:11px;background:var(--amber-bg);border:1px dashed var(--amber-border);border-radius:12px;padding:14px 16px;margin:16px 0;}
.awaiting .a-ic{font-size:15px;flex-shrink:0;color:var(--amber-text);}
.awaiting .a-tx{font-size:13.5px;line-height:1.6;color:var(--amber-text);}
.awaiting .a-tx strong{font-weight:700;color:var(--amber-text);}
.callout .c-tx strong{color:var(--text);}
.script-card .why strong,.script-card .dont strong{color:var(--text);}
.script{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-style:italic;font-size:14.5px;line-height:1.6;color:var(--text2);margin:10px 0;}
.script-card{border:.5px solid var(--border);border-radius:14px;padding:16px 18px;margin:14px 0;background:var(--card-bg);}
.script-card h4{font-size:14.5px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em;}
.script-card .dont{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.55;}
.script-card .why{font-size:13.5px;color:var(--text2);margin-top:8px;line-height:1.55;}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:8px 10px;border-bottom:.5px solid var(--border-strong);}
.tbl td{padding:10px 10px;border-bottom:.5px solid var(--border);color:var(--text2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.quiz-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.quiz-progress{font-size:12px;color:var(--text3);margin-bottom:14px;}
.quiz-q{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px;line-height:1.45;}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--border-strong);margin-bottom:9px;font-size:14.5px;color:var(--text);background:var(--bg2);transition:all .15s;}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.picked{border-color:var(--accent);background:var(--accent-soft);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
.quiz-opt.incorrect{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
.quiz-fb{font-size:13.5px;line-height:1.55;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);color:var(--text2);font-weight:600;}
.quiz-fb.correct{background:var(--green-bg);color:var(--green-text);}
.quiz-fb.incorrect{background:var(--red-bg);color:var(--red-text);}
.quiz-dots{display:flex;gap:6px;margin-bottom:16px;}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);}
.quiz-dot.active{background:var(--accent);width:20px;border-radius:99px;}
.quiz-dot.answered{background:var(--text3);}
.stub-gate{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.stub-check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:6px 0;}
.stub-box{width:22px;height:22px;border:1.5px solid var(--border-strong);border-radius:6px;flex-shrink:0;position:relative;margin-top:1px;transition:all .15s;}
.stub-box.on{background:var(--accent);border-color:var(--accent);}
.stub-box.on::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);}
.stub-label{font-size:14.5px;line-height:1.55;color:var(--text2);}
.mod-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.checklist-section{margin-bottom:10px;border:.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card-bg);}
.checklist-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:background .15s;gap:10px;}
.checklist-head:hover{background:var(--bg3);}
.checklist-head-l{display:flex;align-items:center;gap:11px;min-width:0;}
.checklist-head-ic{font-size:17px;flex-shrink:0;}
.checklist-head-tx h4{font-size:14.5px;font-weight:600;margin:0 0 2px;}
.checklist-head-tx p{font-size:12.5px;color:var(--text3);margin:0;}
.checklist-head svg{color:var(--text3);transition:transform .2s;flex-shrink:0;}
.checklist-head svg.open{transform:rotate(180deg);}
.checklist-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);background:var(--bg3);}
.checklist-body.open{max-height:3000px;}
.checklist-body-inner{padding:2px 16px 16px;}
.check-group{margin:10px 0 4px;}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;cursor:pointer;font-size:14.5px;line-height:1.55;border-bottom:.5px solid var(--border);}
.check-item:last-child{border-bottom:none;}
.check-item.done span{color:var(--text3);text-decoration:line-through;}
.check-item input{margin-top:3px;}
.res-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:.5px solid var(--border);border-radius:14px;background:var(--card-bg);margin-bottom:10px;transition:all .2s;}
.res-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.res-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:var(--accent-ink);}
.res-tx{flex:1;min-width:0;}
.res-tx h4{font-size:14.5px;font-weight:600;margin:0 0 2px;}
.res-tx p{font-size:12.5px;color:var(--text3);margin:0;}
.res-arrow{color:var(--text3);flex-shrink:0;}
.contact-card{border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--card-bg);}
.contact-card .cn{font-size:14px;font-weight:600;}
.contact-card .cr{font-size:12px;color:var(--text3);margin-bottom:3px;}
.contact-card .ce{font-size:12.5px;color:var(--accent-ink);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:999;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.locked-note{display:flex;align-items:center;gap:10px;background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--text2);margin-top:14px;}
