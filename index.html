<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<title>Sesame · Moderator Onboarding</title>
<style>
:root{
  --accent:#B8926A; --accent-dim:#9A7854; --accent-soft:rgba(184,146,106,0.15); --accent-ink:#B8926A;
  --amber:#B8926A; --amber-bg:#FBF6EE; --amber-text:#5C3D1A; --amber-border:#d4b896;
  --green:#22c55e; --green-bg:#EAF3DE; --green-text:#27500A;
  --red:#ef4444; --red-bg:#FEF2F2; --red-text:#991b1b;
  --blue:#3b82f6; --blue-bg:#EFF6FF; --blue-text:#1e3a8a;
  --font:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --font-num:'Avenir Next','Avenir','SF Pro Display',-apple-system,sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12100E; --bg2:#1C1814; --bg3:#252119; --bg4:#302C25;
  --text:#EFE8DC; --text2:#B8A08A; --text3:#9C8D75;
  --border:#221E18; --border-strong:#352F26;
  --input-bg:#1C1814; --card-bg:#1C1814; --nav-bg:rgba(18,16,14,0.92); --sidebar-bg:#1C1814;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.50); --shadow-md:0 8px 40px rgba(0,0,0,0.62); --shadow-lg:0 20px 60px rgba(0,0,0,0.72);
  --accent-ink:#D4A87A;
  --bg-glow:#2A1E10;
  --bg-glow2:#1E1A12;
  --seed-op:1;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F3EC; --bg2:#FDFBF7; --bg3:#EDE8DE; --bg4:#E0D9CC;
  --text:#2C241A; --text2:#6B5840; --text3:#9C8B76;
  --border:rgba(100,75,40,0.12); --border-strong:rgba(85,60,25,0.20);
  --input-bg:#EDE8DE; --card-bg:#FDFBF7; --nav-bg:rgba(247,243,236,0.92); --sidebar-bg:#FDFBF7;
  --shadow-sm:0 2px 12px rgba(60,40,10,0.06); --shadow-md:0 8px 40px rgba(60,40,10,0.10); --shadow-lg:0 20px 60px rgba(60,40,10,0.12);
  --accent-ink:#8A6840;
  --bg-glow:#EDD8B8;
  --bg-glow2:#F5ECD8;
  --seed-op:0.45;
}
*{box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}input:focus{outline:none;}
html,body{margin:0;padding:0;}
/* Sesame seed pattern background (dark mode only, via --seed-op) with amber glows. */
body{
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(5px 1.8px at 8% 16%, rgba(210,188,155,calc(0.10*var(--seed-op))), transparent 100%) 0 0/200px 160px repeat,
    radial-gradient(1.6px 5px at 31% 71%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/280px 220px repeat,
    radial-gradient(4px 1.5px at 73% 42%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/240px 190px repeat,
    radial-gradient(1.4px 4.5px at 88% 25%, rgba(210,188,155,calc(0.07*var(--seed-op))), transparent 100%) 0 0/190px 150px repeat,
    radial-gradient(3.5px 2px at 52% 88%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/260px 200px repeat,
    radial-gradient(2px 3.5px at 19% 45%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/220px 175px repeat,
    radial-gradient(circle at 12% 100%, var(--bg-glow) 0%, transparent 38%),
    radial-gradient(circle at 90% -4%, var(--bg-glow2) 0%, transparent 42%),
    var(--bg);
  background-attachment:fixed;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);}
#login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(5px 1.8px at 8% 16%, rgba(210,188,155,calc(0.10*var(--seed-op))), transparent 100%) 0 0/200px 160px repeat,
    radial-gradient(1.6px 5px at 31% 71%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/280px 220px repeat,
    radial-gradient(4px 1.5px at 73% 42%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/240px 190px repeat,
    radial-gradient(1.4px 4.5px at 88% 25%, rgba(210,188,155,calc(0.07*var(--seed-op))), transparent 100%) 0 0/190px 150px repeat,
    radial-gradient(3.5px 2px at 52% 88%, rgba(210,188,155,calc(0.08*var(--seed-op))), transparent 100%) 0 0/260px 200px repeat,
    radial-gradient(2px 3.5px at 19% 45%, rgba(210,188,155,calc(0.09*var(--seed-op))), transparent 100%) 0 0/220px 175px repeat,
    radial-gradient(circle at 12% 100%, var(--bg-glow) 0%, transparent 38%),
    radial-gradient(circle at 90% -4%, var(--bg-glow2) 0%, transparent 42%),
    var(--bg);
}
.entry-card{background:var(--card-bg);border:.5px solid var(--border);border-top-color:rgba(184,146,106,0.45);border-radius:22px;box-shadow:var(--shadow-lg);padding:44px 40px 34px;width:100%;max-width:420px;text-align:center;}
.brand-mark{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 4px 22px rgba(184,146,106,0.38),0 1px 0 rgba(255,255,255,0.12) inset;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px;}
.entry-title{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px;}
.entry-sub{font-size:14.5px;color:var(--text2);line-height:1.55;margin-bottom:28px;}
.field-label{display:block;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.field-input{width:100%;font-size:15.5px;padding:12px 14px;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;color:var(--text);letter-spacing:-.005em;transition:border-color .18s,box-shadow .18s;}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-input::placeholder{color:var(--text3);}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:left;}
.hint-line{font-size:12.5px;color:var(--text3);margin-top:18px;line-height:1.5;}
.version-tag{font-size:10.5px;color:var(--text3);margin-top:22px;opacity:.7;}
.btn{font-size:15px;font-weight:500;letter-spacing:-.01em;padding:11px 16px;border-radius:12px;border:.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .22s cubic-bezier(.4,0,.2,1);width:100%;}
.btn-primary{background:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{background:var(--bg2);color:var(--text);border:.5px solid var(--border-strong);width:auto;}
.btn-secondary:hover{background:var(--bg4);}
.btn-ghost{background:transparent;color:var(--text2);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-sm{font-size:12px;font-weight:500;padding:5px 12px;border-radius:8px;border:.5px solid var(--border-strong);background:var(--bg3);color:var(--accent);cursor:pointer;white-space:nowrap;}
.btn-sm:hover{background:var(--accent);color:#fff;}
.page-wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%;}
.shell{min-height:calc(100vh - 90px);}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 18px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0;}
.nav-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(184,146,106,0.28);}
.nav-brand{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-brand span{color:var(--text3);font-weight:400;}
.nav-right{display:flex;align-items:center;gap:12px;}
.who{display:flex;align-items:center;}
.who-text{font-size:13px;line-height:1.4;text-align:right;}
.role-line{color:var(--accent-ink);font-size:11.5px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.icon-btn:hover{background:var(--bg4);color:var(--text);}
.btn-signout{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--border-strong);color:var(--text2);font-size:12.5px;font-weight:600;}
.btn-signout:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.nav-tabs{display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--border);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow-sm);margin-bottom:22px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .2s;flex:1;min-width:fit-content;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;font-weight:600;box-shadow:0 4px 14px var(--accent-soft);}
.content{padding:0 0 60px;min-width:0;overflow-x:hidden;width:100%;}
h1.page-h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;}
.page-sub{font-size:14.5px;color:var(--text2);margin:0 0 24px;line-height:1.5;}
.card{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow-sm);}
.hero-box{background:var(--card-bg);border:.5px solid var(--border);border-radius:20px;padding:26px 28px;margin-bottom:26px;box-shadow:var(--shadow-sm);}
.hero-box.certified{border-color:rgba(34,197,94,.35);box-shadow:0 0 0 1px rgba(184,146,106,0.12),var(--shadow-sm);}
.hero-title2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px;}
.hero-sub2{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.progress-track{height:8px;border-radius:99px;background:var(--bg4);overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-label{font-size:12.5px;color:var(--text3);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em;}
.pill-green{background:var(--green-bg);color:var(--green-text);border:.5px solid rgba(34,197,94,.3);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border:.5px solid var(--amber-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border:.5px solid rgba(59,130,246,.3);}
.pill-gray{background:var(--bg3);color:var(--text3);border:.5px solid var(--border-strong);}
.stepper{margin-top:6px;}
.step-row{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.step-row:last-child{padding-bottom:0;}
.step-row:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);}
.step-dot{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text3);border:2px solid var(--border-strong);z-index:1;}
.step-dot.locked{opacity:.55;}
.step-dot.current{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.step-dot.done{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,0.15);}
.step-body{flex:1;padding-top:3px;min-width:0;}
.step-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
.step-title.locked{color:var(--text3);}
.step-meta{font-size:12px;color:var(--text3);}
.step-row.clickable{cursor:pointer;}
.step-row.clickable:hover .step-title{color:var(--accent-ink);}
.module-page{max-width:760px;margin:0 auto;}
.r-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px;}
.r-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;}
.r-sub{font-size:14.5px;color:var(--text2);margin-bottom:8px;}
.r-meta{font-size:12.5px;color:var(--text3);margin-bottom:26px;}
.reader{font-size:15px;line-height:1.72;color:var(--text);}
.reader h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:30px 0 12px;}
.reader h3{font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:24px 0 10px;}
.reader p{margin:0 0 14px;color:var(--text2);}
.reader ul,.reader ol{margin:0 0 14px;padding-left:22px;color:var(--text2);}
.reader li{margin-bottom:7px;line-height:1.6;color:var(--text2);}
.reader strong{color:var(--text);}
.callout{display:flex;gap:11px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:16px 0;}
.callout .c-ic{font-size:16px;line-height:1.4;flex-shrink:0;color:var(--accent-ink);}
.callout .c-tx{font-size:14.5px;line-height:1.6;color:var(--text2);}
.callout .c-tx strong{color:var(--text);}
.callout.warn{border-left-color:var(--amber);}.callout.warn .c-ic{color:var(--amber);}
.callout.danger{border-left-color:var(--red);}.callout.danger .c-ic{color:var(--red);}
.callout.info{border-left-color:var(--blue);}.callout.info .c-ic{color:var(--blue);}
.awaiting{display:flex;gap:11px;background:var(--amber-bg);border:1px dashed var(--amber-border);border-radius:12px;padding:14px 16px;margin:16px 0;}
.awaiting .a-ic{font-size:15px;flex-shrink:0;color:var(--amber-text);}
.awaiting .a-tx{font-size:13.5px;line-height:1.6;color:var(--amber-text);}
.awaiting .a-tx strong{font-weight:700;color:var(--amber-text);}
.callout .c-tx strong{color:var(--text);}
.script-card .why strong,.script-card .dont strong{color:var(--text);}
.script{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-style:italic;font-size:14.5px;line-height:1.6;color:var(--text2);margin:10px 0;}
.script-card{border:.5px solid var(--border);border-radius:14px;padding:16px 18px;margin:14px 0;background:var(--card-bg);}
.script-card h4{font-size:14.5px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em;}
.script-card .dont{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.55;}
.script-card .why{font-size:13.5px;color:var(--text2);margin-top:8px;line-height:1.55;}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:8px 10px;border-bottom:.5px solid var(--border-strong);}
.tbl td{padding:10px 10px;border-bottom:.5px solid var(--border);color:var(--text2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.quiz-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.quiz-progress{font-size:12px;color:var(--text3);margin-bottom:14px;}
.quiz-q{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px;line-height:1.45;}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--border-strong);margin-bottom:9px;font-size:14.5px;color:var(--text);background:var(--bg2);transition:all .15s;}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.picked{border-color:var(--accent);background:var(--accent-soft);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
.quiz-opt.incorrect{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
.quiz-fb{font-size:13.5px;line-height:1.55;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);color:var(--text2);font-weight:600;}
.quiz-fb.correct{background:var(--green-bg);color:var(--green-text);}
.quiz-fb.incorrect{background:var(--red-bg);color:var(--red-text);}
.quiz-dots{display:flex;gap:6px;margin-bottom:16px;}
.quiz-dot{width:7px;height:11px;border-radius:50%;background:var(--border-strong);transition:all .2s;}
.quiz-dot.active{background:var(--accent);width:22px;height:11px;border-radius:99px;box-shadow:0 0 8px rgba(184,146,106,0.35);}
.quiz-dot.answered{background:var(--accent-dim);opacity:.6;}
.stub-gate{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.stub-check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:6px 0;}
.stub-box{width:22px;height:22px;border:1.5px solid var(--border-strong);border-radius:6px;flex-shrink:0;position:relative;margin-top:1px;transition:all .15s;}
.stub-box.on{background:var(--accent);border-color:var(--accent);}
.stub-box.on::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);}
.stub-label{font-size:14.5px;line-height:1.55;color:var(--text2);}
.mod-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.checklist-section{margin-bottom:10px;border:.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card-bg);}
.checklist-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:background .15s;gap:10px;}
.checklist-head:hover{background:var(--bg3);}
.checklist-head-l{display:flex;align-items:center;gap:11px;min-width:0;}
.checklist-head-ic{font-size:17px;flex-shrink:0;}
.checklist-head-tx h4{font-size:14.5px;font-weight:600;margin:0 0 2px;}
.checklist-head-tx p{font-size:12.5px;color:var(--text3);margin:0;}
.checklist-head svg{color:var(--text3);transition:transform .2s;flex-shrink:0;}
.checklist-head svg.open{transform:rotate(180deg);}
.checklist-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);background:var(--bg3);}
.checklist-body.open{max-height:3000px;}
.checklist-body-inner{padding:2px 16px 16px;}
.check-group{margin:10px 0 4px;}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;cursor:pointer;font-size:14.5px;line-height:1.55;border-bottom:.5px solid var(--border);}
.check-item:last-child{border-bottom:none;}
.check-item.done span{color:var(--text3);text-decoration:line-through;}
.check-item input{margin-top:3px;}
.res-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:.5px solid var(--border);border-radius:14px;background:var(--card-bg);margin-bottom:10px;transition:all .2s;}
.res-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.res-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:var(--accent-ink);}
.res-tx{flex:1;min-width:0;}
.res-tx h4{font-size:14.5px;font-weight:600;margin:0 0 2px;}
.res-tx p{font-size:12.5px;color:var(--text3);margin:0;}
.res-arrow{color:var(--text3);flex-shrink:0;}
.contact-card{border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--card-bg);}
.contact-card .cn{font-size:14px;font-weight:600;}
.contact-card .cr{font-size:12px;color:var(--text3);margin-bottom:3px;}
.contact-card .ce{font-size:12.5px;color:var(--accent-ink);}

// on the login screen are intentionally left in for now (per direct

const MODULES = [{"id": "welcome", "ic": "&#127793;", "title": "Welcome to Sesame", "sub": "What this course covers and what to expect before we start.", "min": 4, "gate": "none", "body": "\n<p>Welcome — you're about to start onboarding for Project Sesame. Before anything else, here's the shape of what you're signing up for and how this course works.</p>\n\n<h2>What Sesame is, in one paragraph</h2>\n<p>Sesame is a multimodal data collection project run at the <strong>Centific Las Vegas Lab</strong>. In teams of two, you'll run participants through short, unscripted movement scenarios in staged rooms while radar, 360&deg; video and audio record simultaneously. The radar motion data is the primary deliverable; video and audio exist to validate what the radar captured. The next module covers who Centific is; the one after that covers the moderator role and how to reach the team. This is just enough to orient you before that.</p>\n\n<h2>How this course works</h2>\n<ul>\n<li><strong>Modules unlock in order.</strong> Each one opens after you finish the one before it. You can always go back and re-read anything you've already completed.</li>\n<li><strong>Most modules end with a short knowledge check</strong> — a few questions to confirm you're reading, not clicking through. Answers are flagged, not blocking, except for the final check.</li>\n<li><strong>A few modules are placeholders by design</strong> — Hardware Setup, Hydra, and Troubleshooting point at your in-person training rather than trying to teach hands-on equipment work through a screen. You'll see them marked clearly, with a simple &quot;I've reviewed this&quot; checkbox standing in until on-site training happens.</li>\n<li><strong>A final scenario check</strong> comes after every module is complete — 40 questions covering everything except the Who Is Centific module, since that one's about the company rather than the job. That's what actually certifies you for on-site training. You get <strong>three attempts</strong> to pass it. If you don't pass within three attempts, your Project Manager will follow up directly rather than the app opening a fourth.</li>\n<li><strong>A Field Reference tab</strong> becomes available once you're in the app — keep it open on your phone during an actual session for quick access to scripts, escalation steps, and troubleshooting, without digging back through training content.</li>\n</ul>\n\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\">If anything in this course is unclear, or a link looks broken, that's useful to know — route it to Ingrid Lindstrom (Training &amp; Development). You'll get her contact details, along with everyone else's, in the next couple of modules.</div></div>\n\n<p>Ready? Next up: who Centific actually is, and what your role means in practice.</p>\n"}, {"id": "centific", "ic": "&#127760;", "title": "Who Is Centific", "sub": "Who we are, what the data collection team does, and what your role is.", "min": 8, "gate": "quiz", "body": "\n<p>If a participant asks you who Centific is, this is all you need:</p>\n<div class=\"script\">Centific is a global data and AI company. We collect real-world data — video, audio, sensor and behavioral data — so that AI systems learn to recognize the world as it actually looks and moves. Today's captures become part of the training material that teaches those systems what they're looking at.</div>\n<p>Everything below is context so you can answer follow-up questions with confidence. You are not expected to recite it.</p>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — Centific Branding<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Oslo_Sesame_Moderators2/Shared%20Documents/Centific%20Video%20Resources/Moderator%20Fundamentals%20-%20Centific%20Branding.mp4?d=w3d62047845644977b2b632b90d0430ff&csf=1&web=1&e=Zg70Uj\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<h2>1. Who is Centific?</h2>\n<p>Centific is a global data and AI solutions company. We do not build the AI products you would recognize by name. We build the data those products learn from — which is why Centific is sometimes described as the hidden infrastructure behind AI models.</p>\n<p>Our clients are companies that build AI systems. They come to us because a model is only as good as the data it learned from, and good data does not exist by default. Someone has to go out and create it, carefully, with real people. That is our job.</p>\n<p>What we provide to those clients:</p>\n<ul>\n<li><strong>Data creation and collection.</strong> Speech, conversation, video, images, sensor data, and text are all types of data we collect. These are gathered in structured sessions like the ones you will run.</li>\n<li><strong>Human judgment and evaluation.</strong> Experts review, rate, correct, and label AI output so systems learn what a good answer looks like and where they get things wrong.</li>\n<li><strong>Language and cultural coverage.</strong> Data work in 350+ languages and regional variants, so AI works for people outside a handful of major markets.</li>\n<li><strong>Platforms and tooling.</strong> The systems that manage all the above at scale, including the tools you will use to run and submit sessions.</li>\n</ul>\n<p>The scale behind that: a network of over 1.8 million domain experts, working across 230+ markets and 50+ industries.</p>\n<p>Centific's mission line is <em>&quot;The Future Learns Here.&quot;</em> That is literal. The data collected in your sessions is what the technology learns from.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>One rule that never changes:</strong> we never disclose which client a project is for. Not to participants, not to friends, not on social media. That confidentiality is part of the agreement Centific has with every client, and it is part of your agreement with Centific.</div></div>\n\n<h2>2. What does the data collection team do?</h2>\n<p>The data collection team is the part of Centific that turns a client requirement into a finished, usable dataset. A client says, in effect, &quot;our system needs to understand natural human movement through indoor spaces.&quot; The data collection team designs and runs the work that produces it.</p>\n<p>End to end, that looks like:</p>\n<ol>\n<li><strong>Define the spec.</strong> What kind of movement, from which kinds of people, in what conditions, and what counts as acceptable quality.</li>\n<li><strong>Recruit and consent participants.</strong> Find people who match the profile, explain what they are agreeing to, and collect proper consent before anything is recorded.</li>\n<li><strong>Schedule and prepare.</strong> Match participants to sessions and moderators, confirm attendance, and make sure the tooling works before anyone joins.</li>\n<li><strong>Run the sessions.</strong> This is where you come in. Moderators run the actual capture sessions to the project format.</li>\n<li><strong>QA review.</strong> Every capture is checked against the project quality standards. Sessions that miss the bar are flagged, returned, or rejected.</li>\n<li><strong>Process and deliver.</strong> Accepted sessions are processed, labeled, packaged into a dataset, and delivered to the client to train and evaluate their system.</li>\n</ol>\n<p>Two things worth understanding about how the team works:</p>\n<ul>\n<li><strong>Quality is the product, not volume.</strong> A large pile of unusable captures is worth nothing. The team is measured on how much data passes QA, not on how much was recorded.</li>\n<li><strong>Every stage depends on the one before it.</strong> A rejected session does not just cost one recording; it costs the participants' time, the recruiter's effort, and leaves a gap in the dataset that someone must fill again.</li>\n</ul>\n<p>As a Sesame moderator, you will mainly interact with your Project Manager (scheduling, questions, escalations) and, indirectly, with QA, whose feedback tells you whether your sessions are hitting the standard. Names and contact details are covered in the Moderator Fundamentals module.</p>\n\n<h2>3. What is the Moderator role on Sesame?</h2>\n<p>Moderators always work in pairs, and each half of the pair has a distinct job. Together, you are the people who run the session and are responsible for the captured data being usable.</p>\n<ul>\n<li><strong>The Primary Moderator is the movie director.</strong> Their job is to make sure participants act, move, speak, gesture, and engage with the room to the client's specification.</li>\n<li><strong>The QA Moderator is the cinematographer.</strong> Their job is to operate the multimodal camera, microphone, and radar kit to accurately capture motion, sound, and participant orientation in the given environment.</li>\n</ul>\n<p><strong>Both moderators direct the scene — neither performs in it — and neither issues a stream of commands mid-episode.</strong> The moderator team coaches and facilitates throughout. When a capture needs to be redone, the team informs the participant and demonstrates how to do it effectively, so the next take is the highest quality it can be.</p>\n<ul>\n<li><strong>Prepare.</strong> Check your equipment, the room, and the recording tool before the session starts — not while a participant is waiting.</li>\n<li><strong>Set people at ease.</strong> Welcome participants, explain what is going to happen, and confirm they understand what they consented to. Nervous participants produce stiff, unnatural movement, which is exactly what the dataset does not need.</li>\n<li><strong>Hold the format.</strong> Keep the session inside spec — the right rooms, the right movement, the right timing.</li>\n<li><strong>Keep the action natural.</strong> Brief clearly, then step back. A light, occasional redirect is fine; running commentary is not.</li>\n<li><strong>Handle problems live.</strong> Equipment hiccups, a participant who drifts out of frame, anything unexpected — moderators handle it in the moment.</li>\n<li><strong>Submit correctly and flag issues.</strong> Follow the submission steps exactly, and tell your Project Manager about anything that went wrong. An honest flag is far cheaper than a surprise found in QA.</li>\n</ul>\n<p>Just as important, what the role is not:</p>\n<ul>\n<li><strong>You are not an interviewer or researcher.</strong> You are not there to collect opinions or test a product. The movement itself is the deliverable.</li>\n<li><strong>You are not the QA reviewer.</strong> You apply first-line quality judgment, but you do not decide whether a session is accepted. Flag it and let QA decide.</li>\n<li><strong>You are not the client's representative.</strong> You represent Centific. You cannot speak for the client, and you cannot name them.</li>\n<li><strong>You are not expected to improvise policy.</strong> If a participant asks something you were not briefed on, route it to Oslo_comms@centific.com. Centific's delivery team monitors this inbox and answers participant questions there.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>The core of the job:</strong> be warm enough that people forget they are being watched, while quietly holding the room to a technical spec. These are two sides of the same coin, and getting the balance right is the whole skill.</div></div>\n<p>You are also, for most participants, the only people from Centific they will ever meet. To them, you are the company. How you handle the session shapes whether they trust the process and whether they come back for future work.</p>\n\n<h2>Why we collect data — the honest answer</h2>\n<p>AI systems learn from examples. If the examples are narrow, the system is narrow. A model trained mostly on staged, cooperative, obviously-posed movement will fail the moment it meets a real person moving through a real room without thinking about it.</p>\n<p>That failure is not an abstraction. It means a system that misreads ordinary movement, that can't tell a person reaching for a cabinet from a person falling, or that treats a normal pause as an anomaly — because scenes like that were not in the training data. Precision matters here specifically because the underlying sensor is reading motion, not appearance: the value is in exactly what moved, exactly where, and exactly how.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9679;</div><div class=\"c-tx\">Real, natural, unscripted human movement through a space is genuinely hard to obtain cleanly. It can't be scraped, and a rendered or staged substitute behaves subtly wrong. It has to be captured, with consent, by people who agree to take part and are directed by someone who knows how to keep it natural rather than performative. That is why these sessions exist.</div></div>\n\n<h2>Saying it to a participant</h2>\n<p>Keep it short, plain, and honest. Something like:</p>\n<div class=\"script\">&quot;I work with Centific — we're a company that collects data used to train AI systems. Today we're recording your movement through a few different rooms using cameras, microphones and a motion sensor. The reason is that this kind of technology has to work with real, natural movement, and that's genuinely hard to come by any other way.&quot;</div>\n<div class=\"script\">&quot;The recordings get reviewed for quality and then go into a dataset used to train that technology. You agreed to that in the consent form you signed, and you can stop or ask me anything at any point.&quot;</div>\n\n<h2>What not to say</h2>\n<ul>\n<li><strong>Never name the client.</strong> If asked which company the data is for, say plainly: &quot;I'm not able to share the client's name — that's part of our agreement with them. What I can tell you is what the data is used for.&quot; That is a complete, professional answer. Do not hint, do not guess, do not confirm a participant's guess.</li>\n<li><strong>Do not speculate.</strong> If you do not know how the data will be used beyond what you have been told, say so and offer to route the question.</li>\n<li><strong>Do not make promises</strong> about payment amounts, timelines, retention periods, or future work that are not in the project documentation you were given.</li>\n<li><strong>Do not oversell.</strong> &quot;You're helping build AI that understands how people actually move&quot; is true. Promising your session will end up in a specific named product is not something you can say.</li>\n</ul>\n\n<h2>Questions participants actually ask</h2>\n<ul>\n<li><strong>&quot;Who is this for?&quot;</strong> — Centific collects data on behalf of companies that build AI systems. You cannot name the client, and you can say that openly.</li>\n<li><strong>&quot;Will I be identifiable?&quot;</strong> — Be straightforward: this is a Centific facility, not a public space, and the cameras are recording the room and the movement in it. How footage is handled, stored, and who can see it is set out in the consent form they signed, and Oslo_comms@centific.com answers anything the form does not. Do not speculate about de-identification.</li>\n<li><strong>&quot;What happens to my recording?&quot;</strong> — It is reviewed for quality, processed, and used as AI training data under the terms in the consent form.</li>\n<li><strong>&quot;Am I doing it right?&quot;</strong> — Reassure them: there is no wrong way to do this. Just move naturally. This is usually the most useful thing you can say all session.</li>\n</ul>\n\n<h2>Why this matters for you</h2>\n<p>Participants relax when the people running the session sound like they know what they are doing and why. A moderator team that can explain the purpose in two clear sentences gets a more natural session — which is exactly what a Centific project is trying to capture. Confidence about the &quot;why&quot; is a quality tool, not just a courtesy.</p>\n"}, {"id": "fundamentals", "ic": "&#127775;", "title": "Moderator Fundamentals", "sub": "What Sesame is, the movie director / cinematographer split, who to contact, and the full script library.", "min": 26, "gate": "quiz", "body": "\n<h2>What Sesame is</h2>\n<p>Sesame is a multimodal data collection project. Radar motion data is the primary deliverable; 360&deg; video and audio exist to validate what the radar captured. You will work in a pair, running participants through short, unscripted movement scenarios across a set of staged rooms.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#128205;</div><div class=\"c-tx\"><strong>Sesame currently collects data at the Centific Las Vegas Lab, per client specification.</strong> There are no participant home visits on this collection. If the client requests additional collections, the project may expand to offsite (participant home) work in the future — this module and its scripts note where a rule is written for either setting.</div></div>\n<p><strong>You may be seen and heard on camera.</strong> This is a real change from prior Centific collections, and worth repeating: the radar is the primary data source, and video/audio exist to validate what it captured — not the reverse. Minimal, natural verbal cueing (&quot;starting now,&quot; &quot;that's the end of that one&quot;) is fine. Continuous direction (&quot;go there now, now do this&quot;) is not — it degrades the capture and reads as staged rather than natural.</p>\n<p><strong>Sessions run with one or two participants.</strong> Duration is identical either way — you never record participants separately and then together. With two participants, they move independently and asynchronously, not in a coordinated or mirrored way.</p>\n<p><strong>You always work as a pair: a Primary Moderator and a QA Moderator.</strong> The Primary is the <strong>movie director</strong>, making sure participants act, move, speak, gesture, and engage with the room to the client's specification. The QA Moderator is the <strong>cinematographer</strong>, operating the multimodal camera, microphone, and radar kit to accurately capture motion, sound, and participant orientation. Both of you direct the scene, neither of you performs in it, and neither issues a stream of commands mid-episode. Both moderators are trained on both roles — this keeps scheduling flexible, since the team is small on this collection.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9679;</div><div class=\"c-tx\"><strong>Redoing a capture is a coaching moment, not a correction.</strong> If a take needs to be redone, the team informs the participant and demonstrates how to do it effectively, so the next take comes out at the highest quality.</div></div>\n<div class=\"awaiting\"><div class=\"a-ic\">&#9203;</div><div class=\"a-tx\"><strong>Awaiting confirmation:</strong> the moment-to-moment handoff between Primary and QA within a room (exactly when each is speaking vs. operating the rig) is still being finalized with your Project Manager. This module will update once that's settled.</div></div>\n\n<h2>The room and the environment</h2>\n<p>All sessions happen in staged rooms at the Las Vegas Lab. A few things are different from a real home:</p>\n<ul>\n<li><strong>Props may not be functional.</strong> A tap may not run, a lamp may not be plugged in. Do the natural action anyway — reaching for the lamp, turning the tap — the motion is what's being captured, not the outcome.</li>\n<li><strong>No pets, no mirrors.</strong> Mirrors are removed from the lab rooms because they interfere with equipment visibility, not because of any radar confusion — radar reads organic bodies, and a mirror image won't register as a second person.</li>\n<li><strong>Six room types are used, no bathrooms</strong> — there isn't enough usable space in most bathroom layouts for the rig and the movement the client wants.</li>\n</ul>\n\n<h2>What the role is not</h2>\n<ul>\n<li>You are not the client's representative. You represent Centific, you cannot speak for the client, and you cannot name them.</li>\n<li>You are not the QA reviewer of record. You apply first-line judgment, then flag. You do not decide whether a capture is accepted.</li>\n<li>You are not expected to improvise policy. If you are asked something you were not briefed on, routing it is the correct, professional answer — not a failure.</li>\n<li><strong>You are not the site's security team.</strong> If something at the lab feels unsafe or unworkable, your job is to stay calm, pause, and notify your Project Coordinator. It is not to resolve it yourself.</li>\n</ul>\n\n<h2>How participants join Sesame — OneForma</h2>\n<p>Participants are recruited for Project Sesame through <strong>OneForma</strong>. Interested individuals register on the OneForma platform and complete a profile, including demographic information and a preferred payment email address. Individuals who meet the project's criteria are then prompted to complete an <strong>ICF and NDA</strong> on OneForma. <strong>Payment terms and methods (Tremendous) are also specified there</strong> — that's the source of truth for pay, not something you need to know or explain in detail.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\">If a participant still has questions after what OneForma told them, route them to <strong>Oslo_comms@centific.com</strong> — the terms live on their own platform, not with you.</div></div>\n\n<h2>Who to contact</h2>\n<table class=\"tbl\">\n<tr><th>If you need...</th><th>Contact</th><th>Role</th><th>Email</th></tr>\n<tr><td>Sesame process, scheduling, sessions</td><td>Sowmyalakshmi Suresh Kumar</td><td>Project Manager</td><td>sowmyalakshmi.s@centific.com</td></tr>\n<tr><td>Additional questions and non-urgent escalations</td><td>Marine Aghasyan</td><td>Program Manager</td><td><em>pending POC list</em></td></tr>\n<tr><td>Day-to-day coordination and general queries</td><td>Shreya Sreedharan</td><td>Project Coordinator</td><td>shreya.sreedharan@centific.com</td></tr>\n<tr><td>Session hardware, Hydra, and the Sesame App</td><td>Riley Robertson</td><td>Technical Project Coordinator</td><td>riley.robertson@centific.com</td></tr>\n<tr><td>Onboarding: this app, your progress, certification</td><td>Ingrid Lindstrom</td><td>Training &amp; Development</td><td>ingrid.lindstrom@centific.com</td></tr>\n<tr><td>Anything general, or you are not sure who to ask</td><td>The project team</td><td>—</td><td>Oslo_comms@centific.com</td></tr>\n<tr><td>Your pay, rate, bonuses, future work</td><td>Your C2C agency</td><td>—</td><td>Centific cannot answer these. See the Hours and Pay module.</td></tr>\n</table>\n\n<h3>Where you send participants</h3>\n<table class=\"tbl\">\n<tr><th>Participant asks about...</th><th>Send them to</th></tr>\n<tr><td>The consent form (ICF/NDA) they signed on OneForma</td><td>Oslo_comms@centific.com</td></tr>\n<tr><td>How their data will be used, or who sees it</td><td>Oslo_comms@centific.com</td></tr>\n<tr><td>Withdrawing consent or deleting recordings</td><td>Oslo_comms@centific.com</td></tr>\n<tr><td>Payment amount, timing, or method (Tremendous)</td><td>Oslo_comms@centific.com — but remind them the terms are already on their OneForma profile</td></tr>\n</table>\n<p><strong>You route these. You do not answer them.</strong> That is not a brush-off. It is how participants get an accurate answer instead of your best guess.</p>\n<p><strong>Read the address back when you give it to a participant.</strong> It takes a moment and it is what makes sure they reach the monitored account rather than emailing you directly.</p>\n\n<h2>Teams and escalation</h2>\n<p>For anything time-sensitive during a session at the lab, post in the Teams channel <strong>Oslo_Sesame_Moderators</strong> (channel: General) rather than emailing — the team is watching it live during collection hours. Your Project Manager adds you before your first session; if you haven't been added by then, say so.</p>\n<table class=\"tbl\">\n<tr><th>Tier</th><th>What it covers</th></tr>\n<tr><td><strong>Handle it yourself</strong></td><td>Routine session flow, everything the scripts cover, minor equipment hiccups, a normal reschedule.</td></tr>\n<tr><td><strong>Flag to your on-site lead in real time</strong></td><td>Anything you can't resolve safely or compliantly on your own while it's happening: a participant under the influence, an unsafe or unworkable environment, an absent guardian for a minor, inappropriate conduct toward you, a participant in visible distress.</td></tr>\n<tr><td><strong>Report after the fact</strong></td><td>Resolved, but leadership must know: a canceled or cut-short session, a data-withdrawal request, a scope dispute, any participant complaint. Same day.</td></tr>\n<tr><td><strong>Escalate to compliance / legal</strong></td><td>Legal, privacy, or safety weight: a data breach or lost recording, a demand touching the consent form you can't answer, an allegation of misconduct, harm or a threat of harm. Notify your on-site lead AND the designated compliance/legal contact — do not try to resolve these yourself.</td></tr>\n</table>\n\n<h2>What gets logged after every session</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Confirmed: the session log and incident tracker live in the Sesame App</strong> — the checklist webapp, not Hydra. Every required session step in the Sesame App has a place to record what happened, so you're not keeping a separate manual log.</div></div>\n<p>Keep entries factual and free of diagnosis, opinion, or the client's name. At minimum, capture: session basics (date, time, moderators, participant identifier — not free-text personal details), outcome (completed / rescheduled / cut short / canceled and why), scope covered (which rooms and episodes, and anything skipped), consent status, issues and how they were handled in neutral observable terms, and any escalation with what was passed along and to whom. Never record diagnoses (&quot;drunk,&quot; &quot;high&quot;), payment amounts, or the client's identity — describe behavior, not conclusions.</p>\n\n<h2>Scripts</h2>\n<p>These sixteen cards are the moderator team's playbook for the situations that come up most. Scripts are scaffolding, not lines to memorize — the facilitator at in-person training will assess your posture and judgment, not word-for-word recall. Compliance is the spine of every card: never name the client, never quote figures on site, never handle money; route open questions to Oslo_comms@centific.com.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#127908;</div><div class=\"c-tx\"><strong>Practice these out loud.</strong> Reading a script silently is not the same skill as saying it to a real person. You are responsible for practicing these scripts aloud during onboarding, and continuing to run through them with your moderator teammate throughout the project — not just once at the start. Knowing what to say, cold, is what makes fielding an unexpected participant question feel routine instead of stressful.</div></div>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — PT Experience Scenarios<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Oslo_Sesame_Moderators2/Shared%20Documents/Centific%20Video%20Resources/Moderator%20Fundamentals%20-%20PT%20Experience%20Scenarios.mp4?d=w178732cdfcaf45e0a29582ff03076c47&csf=1&web=1&e=j2oSo4\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<h3>Set A — The Participant Journey</h3>\n\n<div class=\"script-card\"><h4>C1 &middot; Welcoming a Nervous or Hesitant Participant</h4>\n<p><strong>Setup:</strong> A participant arrives looking anxious about the cameras and unsure what the session involves.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Hi&#8230; I'm a little nervous, I've never done anything like this.&quot;<br><strong>MOD:</strong> &quot;You're in exactly the right place, welcome. I'm [name], I'll be with you the whole way and I'll walk you through everything before we start. There are no wrong answers here and nothing you can mess up — we'll go at your pace.&quot;<br><strong>PT:</strong> &quot;Okay. What if I do it wrong on camera?&quot;<br><strong>MOD:</strong> &quot;We practice everything first — I'll show you, then we do it together, then we record. By the time we're rolling, it'll feel familiar. All we need is for you to move naturally.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Warmth in the first 10 seconds &middot; states they'll stay with the PT the whole session &middot; frames &quot;no wrong answers&quot; and the rehearse-first flow &middot; keeps purpose framing simple, never names the client.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Jumps into tasks with no reassurance &middot; pressures a hesitant PT to &quot;just start&quot; &middot; names or hints at the client &middot; promises a survey or asks for a review.</div>\n</div>\n\n<div class=\"script-card\"><h4>C2 &middot; Explaining the Session to an Unprepared Participant</h4>\n<p><strong>Setup:</strong> The participant admits they didn't read the OneForma materials or their ICF/NDA in advance.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;I'll be honest, I didn't really read what they sent.&quot;<br><strong>MOD:</strong> &quot;No problem at all — here's the short version. We'll capture short movement scenarios in a few different rooms to help train an AI system. Mostly you'll be walking around and doing everyday things naturally. I'll show each one first and we'll practice.&quot;<br><strong>PT:</strong> &quot;Do I need anything for it?&quot;<br><strong>MOD:</strong> &quot;Just a couple of checks: have you completed your ICF and NDA on OneForma? Those are required to take part. If not, let's sort that before we start, and I'll preview a room or two so nothing's a surprise.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Clear, jargon-free overview &middot; checks the ICF/NDA is signed on OneForma before filming &middot; offers to preview a room &middot; routes anything about data/payment to the compliant script.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Makes the PT feel judged &middot; starts filming before confirming signed forms &middot; improvises data-use or payment terms.</div>\n</div>\n\n<div class=\"script-card\"><h4>C4 &middot; Payment Questions Before the Session</h4>\n<p><strong>Setup:</strong> Before starting, the participant asks how and when they'll be paid, and about possible bonuses.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Before we start — how does getting paid work?&quot;<br><strong>MOD:</strong> &quot;All of that is set out on your OneForma profile — the rate, the method through Tremendous, all of it. If anything's unclear, Oslo_comms@centific.com can pull it up for you.&quot;<br><strong>PT:</strong> &quot;Is there a bonus I can get?&quot;<br><strong>MOD:</strong> &quot;Any bonus terms would also be on your OneForma profile — I don't have separate figures to quote on site. Email Oslo_comms@centific.com if you want it confirmed.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Points to OneForma as the source of truth for pay, rather than quoting a figure from memory &middot; refuses to improvise bonus figures; routes to support &middot; mentions the PT can stop or withdraw consent anytime.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Quotes a bonus/referral figure on site &middot; invents forfeiture/withdrawal terms &middot; implies pay depends on someone else finishing.</div>\n</div>\n\n<div class=\"script-card\"><h4>C5 &middot; Payment Questions After the Session</h4>\n<p><strong>Setup:</strong> The session is complete and the participant asks when the money will arrive and what to do if it's late.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Great — so when do I actually get paid?&quot;<br><strong>MOD:</strong> &quot;That timing is set out on your OneForma profile, through Tremendous. If it doesn't show up on schedule, email Oslo_comms@centific.com and they'll handle it directly.&quot;<br><strong>PT:</strong> &quot;Okay, good to know.&quot;<br><strong>MOD:</strong> &quot;And just to make sure it reaches the right inbox: Oslo_comms@centific.com — [reads it back slowly].&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Points to OneForma/Tremendous as the source of truth &middot; reads the routing email back to confirm spelling &middot; routes delays to the project inbox rather than guessing.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Promises an exact deposit date &middot; handles or offers money directly &middot; reconstructs withdrawal/forfeiture terms.</div>\n</div>\n\n<div class=\"script-card\"><h4>C13 &middot; Language Barrier or Accessibility Need</h4>\n<p><strong>Setup:</strong> The participant has limited English, a hearing impairment, or another disability that changes how instructions must be given.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Sorry — my English is not so good. Sometimes I don't catch everything fast.&quot;<br><strong>MOD:</strong> &quot;That's completely fine — we'll take it slowly and I'll show you each step rather than just explain it. Watch me first, then we try together. Stop me anytime and I'll repeat.&quot;<br><strong>PT:</strong> &quot;Okay. It's easier if I can see it.&quot;<br><strong>MOD:</strong> &quot;Perfect — I'll demonstrate every room before we record, and use simple words and gestures. There's no rush and no wrong pace here.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Slows down, demonstrates visually, and checks understanding after each step &middot; confirms informed consent is real before proceeding &middot; flags your on-site lead if a needed accommodation can't be met.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Speaks faster or louder instead of adapting &middot; assumes understanding without confirming it &middot; improvises or waives consent requirements to &quot;make it work.&quot;</div>\n</div>\n\n<h3>Set B — De-escalation Under Pressure</h3>\n\n<div class=\"script-card\"><h4>C3 &middot; Questions About the Client or Data Use</h4>\n<p><strong>Setup:</strong> The participant asks who the client is and how their footage/data will actually be used.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;So who's actually behind this? And what happens to my footage?&quot;<br><strong>MOD:</strong> &quot;Fair question. I'm not able to name the specific company — what I can say is the footage helps train an AI system that needs to understand real human movement.&quot;<br><strong>PT:</strong> &quot;And the data side?&quot;<br><strong>MOD:</strong> &quot;The full detail lives in the ICF/NDA you signed on OneForma — that's the source of truth, so I won't paraphrase and risk getting it slightly wrong. For anything beyond it, Oslo_comms@centific.com can help.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Never names the client &middot; points to the signed ICF/NDA on OneForma as source of truth &middot; routes extra detail to the project inbox.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Names or guesses at the client &middot; improvises how data will be used &middot; gets flustered instead of routing cleanly.</div>\n</div>\n\n<div class=\"script-card\"><h4>C6 &middot; Frustrated Participant — Wait or Technical Issue</h4>\n<p><strong>Setup:</strong> The participant is irritated after a long wait or an equipment problem interrupts the session.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;I've been sitting here forever, and now the equipment's not working?&quot;<br><strong>MOD:</strong> &quot;I'm sorry you've been waiting — that's on us, not you, and I appreciate your patience. This is a quick fix, nothing you did.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Owns the experience plainly &middot; reassures using &quot;compensation is for time spent participating&quot; &middot; stays calm and resets.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Blames the equipment defensively &middot; offers cash or a bonus to smooth it over &middot; pushes ahead when quality is clearly compromised.</div>\n</div>\n\n<div class=\"script-card\"><h4>C7 &middot; Participant Wants to Stop Mid-Session</h4>\n<p><strong>Setup:</strong> Partway through, the participant says they want to stop, and may ask about their data.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;I think I want to stop. I'm not feeling it.&quot;<br><strong>MOD:</strong> &quot;Absolutely — you can stop at any time, and that's completely okay. You'll still be paid for the time you've already given today; that doesn't change.&quot;<br><strong>PT:</strong> &quot;And what about the recordings of me?&quot;<br><strong>MOD:</strong> &quot;You can withdraw consent at any point. If you withdraw, we delete the affected recordings. Just tell me what you'd like — I can also connect you with Oslo_comms@centific.com for the details.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Respects the choice immediately, no pressure &middot; confirms pay for time already given is unaffected &middot; flags your on-site lead if there's real confusion.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Tries to talk the PT into staying &middot; implies stopping forfeits their pay &middot; improvises forfeiture/withdrawal terms.</div>\n</div>\n\n<div class=\"script-card\"><h4>C8 &middot; Participant Arrives Late</h4>\n<p><strong>Setup:</strong> The participant shows up late to their scheduled lab slot.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;I'm so sorry I'm late, traffic was awful.&quot;<br><strong>MOD:</strong> &quot;Please don't worry — things happen. Let me check where that puts us.&quot;<br><strong>PT:</strong> &quot;Can we still do it?&quot;<br><strong>MOD:</strong> &quot;With the time left today we wouldn't be able to complete it properly, and I'd rather not rush you. Let's rebook so you get the full session — you won't lose your spot.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Warm, non-judgmental greeting &middot; honestly assesses whether a quality session fits &middot; reschedules firmly rather than rushing a compromised session.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Scolds the PT &middot; rushes a compromised session through &middot; promises partial pay for a session that can't run.</div>\n</div>\n\n<div class=\"script-card\"><h4>C14 &middot; Participant Negotiates Scope</h4>\n<p><strong>Setup:</strong> The participant tries to trim the session — &quot;can I skip this room?&quot;, &quot;can we cut this short?&quot; — to finish faster.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Can I just skip this one? Do we really need all these rooms?&quot;<br><strong>MOD:</strong> &quot;I hear you — let's keep it moving. Each room is part of what makes the data usable, so I can't drop them, but I can pace us efficiently and take a short break whenever you need.&quot;<br><strong>PT:</strong> &quot;So it's all or nothing?&quot;<br><strong>MOD:</strong> &quot;The session is designed as a set. If something feels uncomfortable rather than just long, tell me — we can pause or stop entirely, and I'll always respect that.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Explains why full scope matters, kindly &middot; offers flexibility on pace, breaks, and comfort — not on required content &middot; distinguishes &quot;this is long&quot; from &quot;this is uncomfortable.&quot;</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Agrees to skip rooms or cut episodes short to finish early &middot; improvises partial-pay terms &middot; pressures the PT into continuing.</div>\n</div>\n\n<div class=\"script-card\"><h4>C15 &middot; Participant Wants to See Their Footage</h4>\n<p><strong>Setup:</strong> The participant asks to watch what was just recorded of them.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Can you show me what you just recorded? I just want to see how I did.&quot;<br><strong>MOD:</strong> &quot;Totally understand wanting to see — most people do. We got the capture we need, so let's go ahead and move to the next one rather than reviewing it here.&quot;<br><strong>PT:</strong> &quot;Is that a privacy thing?&quot;<br><strong>MOD:</strong> &quot;It's about keeping the session moving efficiently and keeping the process consistent for everyone. How your footage is stored and used is spelled out in the ICF/NDA you signed on OneForma, and Oslo_comms@centific.com can answer anything beyond that.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Validates the curiosity before holding the line &middot; frames it as a pace-and-consistency matter, never a flat refusal — Sesame follows the same approach as prior collections: not &quot;no,&quot; just &quot;let's keep moving.&quot;</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Plays footage back on site &middot; improvises what happens to the footage &middot; makes the PT feel accused or distrusted for asking.</div>\n</div>\n\n<h3>Set C — Boundaries &amp; Safety</h3>\n\n<div class=\"script-card\"><h4>C9 &middot; Requests — Childcare or Transportation</h4>\n<p><strong>Setup:</strong> The participant asks for help with money, transportation, or supervising a child.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;Any chance you could cover my parking, or watch my kid for a sec?&quot;<br><strong>MOD:</strong> &quot;I really wish I could help directly. I'm not able to handle payments or reimbursements on site, and I can't supervise children during the session — I want to give you my full attention.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Kind refusal, offers the correct channel &middot; never hands out cash &middot; for minors, the signing guardian must stay the whole session.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Offers or fronts money &quot;just this once&quot; &middot; agrees to watch a child during the session &middot; leaves the request unrouted.</div>\n</div>\n\n<div class=\"script-card\"><h4>C10 &middot; Safety Protocols</h4>\n<p><strong>Setup:</strong> On arrival, the environment or participant may not be workable — this card is written for a participant home visit. Sesame currently runs at the Centific Las Vegas Lab, where the room and equipment are set and pre-checked by Centific, not assessed by the moderator team on arrival. Keep this card as written, ready to use unchanged, for if and when the project expands to offsite collection.</p>\n<div class=\"script\"><strong>MOD:</strong> &quot;Before we set up, let me take a quick look at the space so we can capture safely and clearly — we need an open, clean area with good line of sight and no mirrors in frame.&quot;<br><strong>PT:</strong> &quot;It's a bit messy, is that a problem?&quot;<br><strong>MOD:</strong> &quot;For a safe, quality session I do need a clean, open, residential setting. As things are right now I can't proceed today, so let's look at rescheduling — I appreciate your understanding.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Assesses workability within 15&ndash;20 minutes &middot; asserts the clean/open/sober requirement &middot; cancels rather than sinking time into a doomed session &middot; for minors, signing guardian present, ID-checked, stays throughout.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Pushes ahead in an unsafe/unsuitable space &middot; continues a minor session with an absent guardian &middot; fails to escalate.</div>\n</div>\n\n<div class=\"script-card\"><h4>C11 &middot; PT Under the Influence</h4>\n<p><strong>Setup:</strong> The participant appears intoxicated or otherwise not sober.</p>\n<div class=\"script\"><strong>MOD:</strong> &quot;We're not able to run the session today. I'm going to head out now.&quot;<br><strong>PT:</strong> &quot;Wait — why? Can we reschedule? What about my payment?&quot;<br><strong>MOD:</strong> &quot;I'm not able to get into that. Take care.&quot; [Moderator ends the session and steps away. No reasons, no reschedule offer, no discussion of payment.]</div>\n<div class=\"why\"><strong>Coach for:</strong> Ends the session outright — no reschedule, no compensation discussion, no negotiation &middot; stays calm and neutral, gives no reason and does not debate the decision &middot; does not diagnose, accuse, or use words like &quot;drunk&quot; or &quot;high&quot; &middot; escalates to your on-site lead and documents immediately after, from a safe location.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Offers to reschedule or implies the PT can come back &middot; discusses or apologizes about compensation &middot; gets drawn into a back-and-forth &middot; confronts or accuses the PT about their state.</div>\n</div>\n\n<div class=\"script-card\"><h4>C12 &middot; Moderator Safety — Onsite &amp; Offsite</h4>\n<p><strong>Setup:</strong> The moderator team is in a setting — a participant's home, if offsite work is added, or the lab itself — and feels the situation isn't safe or workable. This card is written to cover both; on Sesame's current Las Vegas Lab collection, apply the onsite half.</p>\n<div class=\"script\"><strong>MOD:</strong> &quot;Thanks for having me — I'll set up here in the open area where the light and sound are best, and keep everything in this space.&quot;<br><strong>PT:</strong> &quot;We could just use the back room if you want.&quot;<br><strong>MOD:</strong> &quot;This spot works better for the capture. You know, I don't think today's setup will give us a clean result, so I'm going to reschedule rather than push ahead — I'll be in touch through the usual channel. Thanks so much.&quot;</div>\n<div class=\"why\"><strong>Coach for:</strong> Stays in open, visible areas &middot; exits gracefully without over-justifying &middot; notifies your on-site lead; safety before session completion.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Follows the PT into an isolated/closed space &middot; ignores a gut sense that it's unsafe &middot; feels obligated to finish despite discomfort &middot; leaves without notifying anyone.</div>\n</div>\n\n<div class=\"script-card\"><h4>C16 &middot; Participant Inappropriate Toward the Moderator</h4>\n<p><strong>Setup:</strong> The participant makes personal, flirtatious, or otherwise inappropriate comments or advances toward a moderator during the session.</p>\n<div class=\"script\"><strong>PT:</strong> &quot;You're really pretty, you know that? We should get a drink after this.&quot;<br><strong>MOD:</strong> &quot;I'm here in a professional capacity, so let's keep our focus on the session. Back to the next room — I'll demonstrate it first.&quot;<br><strong>PT:</strong> &quot;Come on, don't be like that.&quot;<br><strong>MOD:</strong> &quot;I need us to keep this professional. If that's not workable, I'll end the session here.&quot; [If it continues:] &quot;We're going to stop for today.&quot; [Calmly ends the session and notifies the on-site lead, documenting from a safe location.]</div>\n<div class=\"why\"><strong>Coach for:</strong> Redirects once, firmly and calmly &middot; names the professional boundary without shaming or debating &middot; has a clear end-and-leave line if it continues &middot; notifies your on-site lead and documents after, from safety.</div>\n<div class=\"dont\"><strong>Fail signals:</strong> Laughs it off or engages the personal comments &middot; over-explains or argues the boundary &middot; stays in an escalating situation out of politeness.</div>\n</div>\n\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\">These scripts are scaffolding, not lines to memorize. Your facilitator will assess your posture and judgment against the coach-for and fail-signal boxes above, not word-for-word recall.</div></div>\n"}, {"id": "workflow", "ic": "&#128203;", "title": "Project Workflow", "sub": "The shape of a Sesame session — vocabulary, the C0/T1 arc, and directing natural movement.", "min": 11, "gate": "quiz", "body": "\n<p>Riley delivers full hands-on depth on this at in-person training. This module gives you the sequence and vocabulary in your head before you get there — enough that the on-site day builds on something, rather than starting from zero. The complete step-by-step reference — including the full troubleshooting table and glossary — lives in the Project Guidelines module; this is the version you carry in your head.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Two different apps, two different jobs.</strong> <strong>Hydra</strong> is the macOS app that controls the camera, radar, and microphone and actually manages the recording of a session — it's the only thing that touches multimodal capture data. The <strong>Sesame App</strong> is a separate webapp you can access from any Centific project device; it's a full session checklist that walks you through every required step and holds the session log. Hydra never touches your checklist or metadata; the Sesame App never touches your capture data.</div></div>\n\n<h2>Vocabulary first</h2>\n<table class=\"tbl\">\n<tr><th>Term</th><th>What it means</th></tr>\n<tr><td><strong>Session</strong></td><td>One participant booking. Covers one or more rooms.</td></tr>\n<tr><td><strong>Capture</strong></td><td>One recording in Hydra. All three sensors — radar, camera, microphone — run together for the whole capture.</td></tr>\n<tr><td><strong>Scenario</strong></td><td>The label on a capture: <strong>C0</strong> (calibration) or <strong>T1</strong> (natural tracking).</td></tr>\n<tr><td><strong>Episode</strong></td><td>A timestamped start/end marker <em>inside</em> a capture. Sensors never stop between episodes — only the timestamp changes.</td></tr>\n</table>\n\n<h2>The session arc</h2>\n<ol>\n<li>Open the Sesame App on a Centific project device and start working through its checklist for this session alongside Hydra.</li>\n<li>Connect the radar and microphone; power on the camera; join its Wi-Fi.</li>\n<li>Open Hydra; confirm all three devices show <strong>Devices 3/3</strong> and storage is green.</li>\n<li>In Hydra, select every room that will actually be recorded this session, select one or two participants, and confirm consent.</li>\n<li><strong>C0 — once per session.</strong> Moderator-only; participants can be present but it doesn't involve them.</li>\n<li><strong>T1 — once per room</strong>, for every room selected.</li>\n<li>Review each room capture in Hydra — accept it, or redo the room.</li>\n<li>After the final room: ingest the footage in Hydra while still connected to the camera's Wi-Fi.</li>\n<li>Verify the package completed, mark the corresponding steps done in the Sesame App checklist, and hand off.</li>\n</ol>\n\n<h2>C0 — calibration</h2>\n<ul>\n<li>About 50&ndash;60 seconds. Start the episode with the rig stable, end it near 55 seconds.</li>\n<li>Pick it up with two hands. Smooth loops or figure-eight-like motion; gentle rotation and tilt.</li>\n<li>Add translations covering forward/back, left/right, up/down, roughly 20&ndash;40 cm.</li>\n<li><strong>It's a motion family, not an exact trajectory.</strong> A slightly different loop shape or tilt is not a reason to redo it.</li>\n<li>Never shake, toss, or free-drop the rig — treat it the way you'd treat a real camera.</li>\n<li>Redo only for a sensor failure, a loosened mount, a drop, or almost no real motion.</li>\n<li><strong>C0 calibration motion is not the same as T1 pickup/carry/setdown.</strong> Different purposes — don't confuse one for the other.</li>\n</ul>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Client reference — C0 calibration example<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Oslo_Sesame_Moderators2/Shared%20Documents/Client-Provided%20Video%20Resources/C0_calibration_example.MOV?d=wf60f61811b594b6b82b841e6919fc7bc&csf=1&web=1&e=7LnBMN\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<h2>T1 — natural tracking, per room</h2>\n<ul>\n<li>Before recording: walk the room, identify 6&ndash;8 safe, quick setdown positions, and remember the order. Pre-plan before you start so switch time contains movement, not deliberation.</li>\n<li>Cover different sides, distances and diagonals. Reusing one surface at multiple orientations is fine and expected.</li>\n<li>Nothing should stay tethered to a wall during recording — Mac on battery, camera on its own battery and Wi-Fi.</li>\n<li>Roughly 55 seconds per episode. Retain 10&ndash;15 useful clips per room — 15 is a ceiling, not a quota.</li>\n<li>Between episodes: pick up promptly, carry it steady, set down securely, restart. <strong>Never stop the sensors between episodes.</strong></li>\n<li><strong>Never change rooms while a capture is running.</strong> Move only when all sensors are stopped.</li>\n</ul>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Client reference — view change example<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Oslo_Sesame_Moderators2/Shared%20Documents/Client-Provided%20Video%20Resources/View_change_example.MOV?d=w77c80dfddd5040b192f8901f91882dcd&csf=1&web=1&e=z01wB3\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<h2>Directing natural movement — the moderator team's real craft</h2>\n<p>This is where the movie-director / cinematographer split does the most work, and it has no fixed script — the client wants spontaneity, not repetition.</p>\n<ul>\n<li><strong>Constant motion, no lingering</strong> in one spot.</li>\n<li>A healthy mix of <em>motivated</em> actions (walk to a cabinet, open it, look inside, close it, move on) and <em>unmotivated</em> movement (pacing, walking a route, a brief pause then change of direction).</li>\n<li><strong>No fixed ratio</strong> between the two — the client hasn't specified one, so variety is the goal, not a formula.</li>\n<li>Think &quot;an ordinary person doing ordinary things in that kind of room&quot; — not performative, not comedic.</li>\n<li>Props may not function. Do the action anyway.</li>\n<li>With two participants, they move independently and asynchronously — not mirroring each other.</li>\n<li><strong>When a take needs a redo, coach it.</strong> Tell the participant what to adjust and demonstrate it yourself, so the next take is the best version of that room — don't just say &quot;again&quot; and hope it improves.</li>\n</ul>\n\n<h2>Review and handoff</h2>\n<ul>\n<li>Skim the preview after every recording in Hydra and confirm every episode is present before moving to the next room.</li>\n<li>Accept or redo the room in Hydra. Accept discards nothing; redo discards the whole room capture.</li>\n<li>Complete every selected room before moving to Ingestion — Hydra will not let you skip ahead.</li>\n<li><strong>A transfer reaching 100% is not the same as complete.</strong> Validation and packaging both have to finish too.</li>\n<li><strong>Never force-quit Hydra</strong> during a capture, or while it's finalizing or packaging a session.</li>\n</ul>\n\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Hydra is your source of truth for the actual recording on site.</strong> The Sesame App is your source of truth for the session checklist, metadata, and the session log. Not your phone notes, not a text from your PC, not memory — use the two apps together, not one instead of the other.</div></div>\n"}, {"id": "guidelines", "ic": "&#128196;", "title": "Project Guidelines", "sub": "The full Oslo Sesame Moderator Guide for Hydra — equipment, session steps, troubleshooting, and glossary.", "min": 17, "gate": "quiz", "body": "\n<p>This module is the official <strong>Oslo Sesame Moderator Guide</strong>, adapted for this app. It's the single most detailed module in this course — read it carefully, since the final check draws heavily from it. Keep it bookmarked in the Field Reference tab for quick lookup during a real session.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>This guide describes Hydra</strong> — the macOS app that controls the camera, radar, and microphone and manages an actual recording. It does not cover the Sesame App checklist webapp, which is separate and covered in its own module.</div></div>\n\n<h2>1. The Big Picture — What Are You Actually Doing?</h2>\n<p>You're using a small rig of three sensors — a camera, a radar unit, and a microphone, all fixed together on one mount — to record people moving naturally around a room. This data trains AI systems to understand movement and space. You don't need to know how the AI works. You need to run the equipment correctly and follow the checklist.</p>\n\n<h3>Two kinds of recording, every session</h3>\n<p>Every session is made up of two very different activities. Think of them as &quot;warm-up&quot; and &quot;the real thing&quot;:</p>\n<table class=\"tbl\">\n<tr><th>Scenario</th><th>What it is</th></tr>\n<tr><td><strong>C0 — Calibration Motion</strong><br>(done once, at the start)</td><td>You (the moderator) pick up the whole rig yourself and move it smoothly through the air for about 50&ndash;60 seconds. No one else is involved — no performers, no rooms to walk through, just you, gently moving the device. This teaches the camera's internal motion sensor what &quot;normal movement&quot; looks like.</td></tr>\n<tr><td><strong>T1 — Natural Tracking</strong><br>(done once per room)</td><td>The rig sits in one spot while people move naturally around it — walking, sitting, waving, whatever feels normal. You then pick the rig up, carry it to a new spot in the same room, and repeat. You do this 10&ndash;15 times per room, capturing the room from different angles and distances.</td></tr>\n</table>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>C0 happens once per session, not once per room.</strong> Once it's accepted, you move straight into T1 captures for every room you've selected.</div></div>\n\n<h3>Why different rooms matter</h3>\n<p>A single room is fine for one session — you won't be blocked if that's all you have available. But across your overall assignment (many sessions over time), you need a mix of different rooms, layouts, and backgrounds. Recording the same room over and over teaches the AI about that one room instead of the real world.</p>\n\n<h2>2. Equipment &amp; First-Time Computer Setup</h2>\n<h3>Your kit</h3>\n<p>You'll always work with the same three sensors, physically screwed or clipped onto one rigid mount. Never loosen or change how they're attached to each other.</p>\n<ul>\n<li><strong>TI IWRL6432AOP radar</strong> — a small radar chip that senses movement and distance. It has no screen; you never touch it directly.</li>\n<li><strong>Insta360 X5 camera</strong> — a 360&deg; video camera. This is the only sensor with its own Wi-Fi and its own battery.</li>\n<li><strong>miniDSP ambiMIK microphone</strong> — records ambient audio, connected by a short USB cable.</li>\n<li><strong>MacBook running Hydra</strong> — this is the control center for the recording. Everything you click to actually capture happens here.</li>\n</ul>\n\n<h3>Setting up Hydra (first time only)</h3>\n<ul>\n<li>Copy the Hydra app you were given into the Applications folder on
